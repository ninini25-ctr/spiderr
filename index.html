// ============================================================
// 🖼️ 通用图片压缩 / 裁剪工具
//   - 头像：正方形居中裁剪 + 缩小到 256×256
//   - 参考图：长边缩到 1024，不裁剪
//   - 壁纸：长边缩到 1600，不裁剪
//   - 输出统一 JPEG，质量 0.82~0.88
// ============================================================
function compressImage(file, options) {
  const {
    maxSize = 1024,        // 长边最大像素
    square = false,        // 是否裁剪成正方形
    quality = 0.85,        // JPEG 质量
    maxBytes = 800 * 1024  // 目标体积上限（字节）
  } = options || {};

  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error("没有文件"));

    const reader = new FileReader();
    reader.onerror = () => reject(new Error("读取文件失败"));
    reader.onload = (ev) => {
      const img = new Image();
      img.onerror = () => reject(new Error("图片无法解码（可能是 HEIC 或损坏文件）"));
      img.onload = () => {
        // ---- 1. 计算目标尺寸 ----
        let srcW = img.naturalWidth;
        let srcH = img.naturalHeight;
        let dstW, dstH;

        if (square) {
          // 正方形：取短边做裁剪，输出 maxSize × maxSize
          const side = Math.min(srcW, srcH);
          const sx = (srcW - side) / 2;
          const sy = (srcH - side) / 2;
          dstW = dstH = maxSize;

          const canvas = document.createElement("canvas");
          canvas.width = dstW;
          canvas.height = dstH;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, sx, sy, side, side, 0, 0, dstW, dstH);
          return finish(canvas, quality, maxBytes, resolve, reject);
        } else {
          // 非正方形：长边缩到 maxSize
          const scale = Math.min(1, maxSize / Math.max(srcW, srcH));
          dstW = Math.round(srcW * scale);
          dstH = Math.round(srcH * scale);

          const canvas = document.createElement("canvas");
          canvas.width = dstW;
          canvas.height = dstH;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, dstW, dstH);
          return finish(canvas, quality, maxBytes, resolve, reject);
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 内部：从 canvas 逐步降质，直到 ≤ maxBytes
function finish(canvas, quality, maxBytes, resolve, reject) {
  let q = quality;
  let dataUrl = canvas.toDataURL("image/jpeg", q);
  // 体积兜底：如果超过 maxBytes，每次降 0.08 质量，最低 0.5
  let tries = 0;
  while (dataUrl.length * 0.75 > maxBytes && q > 0.5 && tries < 8) {
    q -= 0.08;
    dataUrl = canvas.toDataURL("image/jpeg", q);
    tries++;
  }
  resolve(dataUrl);
}

// 🖼️ 图片 URL 解析器
//   - 普通 dataURL → 原样返回
//   - "idb:xxx" → 从 IndexedDB 读 dataURL
// ============================================================
async function resolveImageUrl(val) {
  if (!val) return "";
  if (val.startsWith("idb:")) {
    const key = val.slice(4);
    const data = await dbHelper.getImage(key);
    return data || "";
  }
  return val;
}

// 同步版本：用于渲染前已经预加载过的场景（可以用 cache）
const _imgCache = {};
async function resolveImageUrlCached(val) {
  if (!val) return "";
  if (!val.startsWith("idb:")) return val;
  const key = val.slice(4);
  if (_imgCache[key]) return _imgCache[key];
  const data = await dbHelper.getImage(key);
  if (data) _imgCache[key] = data;
  return data || "";
}

function applyAppearance() {
  const cfg = store.get("sv_appearance", {});

  let styleEl = document.getElementById("custom-appearance-style");
  if (!styleEl) {
    styleEl = document.createElement("style");

    document.head.appendChild(styleEl);
  }

  let cssRules = "";

  if (cfg.wallpaper) {
    const wp = cfg.wallpaper.startsWith("idb:")
      ? (_imgCache[cfg.wallpaper.slice(4)] || "")
      : cfg.wallpaper;
    if (wp) {
      cssRules += `
        #desktop .wallpaper {
          background: url('${wp}') center/cover no-repeat !important;
        }
        #desktop .wallpaper::after {
        display: none !important;
        }
      `;
    }
  }

  // 2. 字体
  if (cfg.fontData && cfg.fontName) {
    cssRules += `
      @font-face {
        font-family: '${cfg.fontName}';
        src: url('${cfg.fontData}');
      }
      body, .bubble, .story-content, .app-body, input, textarea, select {
        font-family: '${cfg.fontName}', var(--font-main) !important;
      }
    `;
  }

  // 3. 字号缩放
  if (cfg.fontSize) {
    cssRules += `body { zoom: ${cfg.fontSize}%; }`;
  }

  // 4. 自定义 CSS
  if (cfg.customCss) {
    cssRules += `\n/* Custom User CSS */\n${cfg.customCss}\n`;
  }

  styleEl.innerHTML = cssRules;
}

// 🖼️ 文件选择通用工具：显式触发 + 每次清空（解决 iOS / WebView 点不动）
// ============================================================
function bindFileTrigger(triggerSelector, inputSelector, scope) {
  const root = scope || document;
  const trigger = root.querySelector(triggerSelector);
  const input = root.querySelector(inputSelector);
  if (!trigger || !input) return;

  trigger.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    // ★ 关键：每次点击前清空 value，允许用户重复选同一个文件
    input.value = "";
    input.click();
  });
}

// 🚫 一次性迁移：把"用户之前删过但没进黑名单"的联系人补进黑名单
//    只跑一次，靠 localStorage 标记位防重复
// ============================================================
function migrateDeletedContactsToBlacklist() {
  const MIGRATED_KEY = "sv_blacklist_migrated_v1";
  if (localStorage.getItem(MIGRATED_KEY) === "1") return;

  try {
    // ==== 1. 默认联系人里的"标准名字" ====
    const DEFAULT_CONTACTS = ["彼得·帕克", "内德·利兹", "米歇尔·琼斯", "梅婶"];

    // ==== 2. 当前联系人里还存在的名字（不在黑名单）====
    const currentContacts = (store.getContacts() || []).map(c => c && c.name).filter(Boolean);
    const currentSet = new Set(currentContacts);

    // ==== 3. 现有黑名单 ====
    const existingBlacklist = new Set(store.getBlacklist());

    // ==== 4. 从聊天记录里推断"曾经存在过的联系人" ====
    //     逻辑：如果某个名字在聊天记录（sv_chats）里出现过，
    //     但现在又不在联系人列表里，也没有在黑名单里 → 说明用户删了它
    const chats = store.getChats() || {};
    const chatNames = Object.keys(chats).filter(n => n && !/^群聊\s*·/.test(n));

    // ==== 5. 从日记、推特帖子里也能推断（可选，但更准）====
    //     日记里出现过的"彼得/内德/MJ/梅婶"是固定的，不用推断；
    //     推特帖子里的发帖人里，如果不在联系人里也不在黑名单里，
    //     也可能是被删的联系人（但风险高，容易误判陌生人，所以不用）
    //     这里只从聊天记录推断，最准。

    // ==== 6. 合并所有"曾被删过"的名字 ====
    const toMigrate = [];

    // 6a. 默认联系人里消失的（用户删了默认的）
    DEFAULT_CONTACTS.forEach(name => {
      if (!currentSet.has(name) && !existingBlacklist.has(name) && !store.isBlacklisted(name)) {
        // 还要确认这个默认联系人确实"用过"（有聊天记录，或者当前联系人里曾经有过）
        // 为了安全，只补默认联系人里"曾经在聊天记录里出现过"的
        if (chatNames.includes(name)) {
          toMigrate.push(name);
        }
      }
    });

    // 6b. 聊天记录里出现过、但现在既不在联系人、也不在黑名单里的
    chatNames.forEach(name => {
      if (currentSet.has(name)) return;           // 现在还是联系人
      if (existingBlacklist.has(name)) return;    // 已在黑名单
      if (store.isBlacklisted(name)) return;      // 模糊匹配已在黑名单
      if (toMigrate.includes(name)) return;       // 已加入待迁移
      // 排除群聊（已在上方过滤）
      // 排除"我"/"Me"/空
      if (name === "我" || name === "Me" || !name.trim()) return;
      toMigrate.push(name);
    });

    // ==== 7. 写入黑名单 ====
    if (toMigrate.length > 0) {
      toMigrate.forEach(n => store.addToBlacklist(n));
      console.log("[黑名单迁移] 已自动加入黑名单：", toMigrate);
    }

    // ==== 8. 打标记，防止下次再跑 ====
    localStorage.setItem(MIGRATED_KEY, "1");
  } catch (e) {
    console.warn("[黑名单迁移] 失败：", e);
    // 迁移失败不阻塞页面，下次可重试
  }
}

function migrateAnchorsForLegacy() {
  const KEY = "sv_anchors_migrated_v2";
  if (localStorage.getItem(KEY) === "1") return;
  try {
    const s = store.getState();
    const hasProgress = (s.history && s.history.length > 0)
      || (s.turn && s.turn > 1)
      || (s.anchor && s.anchor > 0);
    const doneEmpty = !s.doneBeats || Object.keys(s.doneBeats).length === 0;

    if (hasProgress && doneEmpty) {
      s.doneBeats = s.doneBeats || {};
      const anchors = getEventAnchors();
      // 之前所有阶段的锚点全部标记为已发生
      for (let i = 0; i < s.anchor; i++) {
        const ph = WORLD.timeline[i];
        if (!ph) continue;
        (anchors[ph.key] || []).forEach(b => { s.doneBeats[b.id] = true; });
      }
      store.setState(s);
      console.log("[锚点迁移] 已为老玩家补标前", s.anchor, "个阶段的锚点");
    }
  } catch (e) {
    console.warn("[锚点迁移] 失败：", e);
  }
  localStorage.setItem(KEY, "1");
}

    "夜魔侠": ["Matt Murdock", "Daredevil", "mattmurdock"],
    "洛基": ["Loki", "loki"]
  };

  banList.forEach(bannedName => {
    // 收集要过滤的名字和别名
    const variants = new Set([bannedName]);
    (aliasMap[bannedName] || []).forEach(v => variants.add(v));

    variants.forEach(v => {
      if (!v) return;
      const esc = v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      // 替换成占位符（用"某位朋友"或直接删掉 + 加 ·）
      out = out.replace(new RegExp(esc, "gi"), "（已删除的联系人）");
    });
  });

  return out;
}

                quotaText = `｜已用 ${usedMB} MB / 上限约 ${quotaGB} GB`;

              return;

            // 先请求
            const granted = await navigator.storage.persist();
            // 再查一次配额
            let quotaText = "";
            if (navigator.storage.estimate) {
              const est = await navigator.storage.estimate();
              const usedMB = (est.usage / 1024 / 1024).toFixed(1);
              const quotaGB = (est.quota / 1024 / 1024 / 1024).toFixed(2);
              quotaText = `｜已用 ${usedMB} MB / 上限约 ${quotaGB} GB`;

    parseComments(str) {
  if (!str) return [];
  const isChinese = (s) => /[\u4e00-\u9fa5]/.test(s);
  const clean = (content) => {
    const m = content.match(/^(.+?)（(.+)）$/);
    if (m && isChinese(m[1].trim()) && isChinese(m[2].trim())) return m[1].trim();
    return content;
  };

  let list = str.split(';;').map(c => {
    const idx = c.search(/[:：]/);
    if (idx === -1) return null;
    const user = c.slice(0, idx).trim();
    const text = c.slice(idx + 1).trim();
    if (!user || !text) return null;
    return { user, text: clean(text), replies: [] };
  }).filter(Boolean);

  // ★ 兜底：少于 5 条时本地补足
  if (list.length < 5) {
    const fillerPool = [
      { user: "queens_boy(美)", text: "😂这是真的吗？" },
      { user: "nyc_gossip(美)", text: "纽约人路过，笑死" },
      { user: "tokyo_ya(日)", text: "🤔これ本当？（这是真的吗？）" },
      { user: "paris_chic(法)", text: "😏Oh là là（哎呀）" },
      { user: "london_fog(英)", text: "Typical.（典型。）🍵" },
      { user: "seoul_night(韩)", text: "대박（厉害）🔥" },
      { user: "midtown_kid(美)", text: "我同学也这样说 🤣" },
      { user: "brooklyn_vibes(美)", text: "楼主是懂什么梗的 💯" }
    ];
    const need = 5 - list.length;
    const picked = fillerPool.sort(() => Math.random() - 0.5).slice(0, need);
    list = list.concat(picked);
  }
  return list;
},

        const idx = parseInt(btn.dataset.idx);
        const all = store.getPosts();
        const post = all.instagram[idx];
        if (!post) return;

        // ==== 创建菜单 ====
        const menu = document.createElement("div");
        menu.className = "__global_menu";
        menu.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,0.6);min-width:200px;overflow:hidden;";

        // 重新生成图片
        if (post.imgPrompt) {
          const redrawItem = document.createElement("div");
          redrawItem.style.cssText = "padding:14px 18px;cursor:pointer;color:#fff;font-size:14px;border-radius:10px;transition:background .15s;";
          redrawItem.textContent = "🔄 重新生成图片";
          redrawItem.onmouseenter = () => redrawItem.style.background = "rgba(45,107,255,0.15)";
          redrawItem.onmouseleave = () => redrawItem.style.background = "transparent";
          redrawItem.onclick = async () => {
            closeMenu();
            body.innerHTML = `<div class="loader"><div class="spin"></div>重新绘制中...</div>`;
            try {
              const newImgUrl = await generateImage(post.imgPrompt);
              const latestAll = store.getPosts();
              latestAll.instagram[idx].img = newImgUrl;
              store.setPosts(latestAll);
              apps.instagram.render(body);
              toast("图片已更新");
            } catch (err) {
              toast("生成失败: " + err.message);
              apps.instagram.render(body);
            }
          };
          menu.appendChild(redrawItem);
        } else {
          const disabledItem = document.createElement("div");
          disabledItem.style.cssText = "padding:14px 18px;color:#666;font-size:14px;";
          disabledItem.textContent = "🔄 重新生成图片（无原始提示词）";
          menu.appendChild(disabledItem);
        }

        // 保存图片
        const saveItem = document.createElement("div");
        saveItem.style.cssText = "padding:14px 18px;cursor:pointer;color:#fff;font-size:14px;border-radius:10px;transition:background .15s;";
        saveItem.textContent = "💾 保存图片";
        saveItem.onmouseenter = () => saveItem.style.background = "rgba(45,107,255,0.15)";
        saveItem.onmouseleave = () => saveItem.style.background = "transparent";
        saveItem.onclick = async () => {
          closeMenu();
          try {
            // 用 fetch 拿到 blob 再下载，避免跨域直接 a[download] 失效
            const resp = await fetch(post.img, { mode: "cors" });
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            // 文件名：name_text前10字.png
            const safeName = String(post.name || "image").replace(/[\\/:*?"<>|]/g, "_");
            a.download = `${safeName}_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 3000);
            toast("图片已保存");
          } catch (err) {
            // 兜底：如果 fetch 跨域失败，直接打开原图让用户手动长按保存
            window.open(post.img, "_blank");
            toast("已在新标签打开，请手动长按保存");
          }
        };
        menu.appendChild(saveItem);

        // 取消
        const cancelItem = document.createElement("div");
        cancelItem.style.cssText = "padding:12px 18px;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid #333;margin-top:4px;";
        cancelItem.textContent = "取消";
        cancelItem.onclick = () => closeMenu();
        menu.appendChild(cancelItem);

        // ==== 遮罩 ====
        const mask = document.createElement("div");
        mask.className = "__global_menu_mask";
        mask.style.cssText = "position:fixed;inset:0;z-index:998;background:rgba(0,0,0,0.55);";
        document.body.appendChild(mask);
        document.body.appendChild(menu);

        let closed = false;
        const closeMenu = () => {
          if (closed) return;
          closed = true;
          menu.remove();
          mask.remove();
          document.removeEventListener("touchstart", onTouchStart);
        };
        const onTouchStart = (e) => {
          if (menu.contains(e.target)) return;
          closeMenu();
        };
        mask.onclick = closeMenu;
        // 延迟绑定全局 touchstart，避免刚打开的点击事件立刻关闭菜单
        setTimeout(() => {
          if (closed) return;
          document.addEventListener("touchstart", onTouchStart, { passive: true });
        }, 350);
      };
    });
  }
},

      const h = new Date().getHours();
      const slot = hourTable.find(x => h >= x.range[0] && h <= x.range[1]) || hourTable[hourTable.length - 1];

      const profile = store.getProfile();

      const sysPrompt = `你正在为一款蜘蛛侠模拟器生成一个"窥视片段"——玩家正隔着一个被遗忘的距离，看到彼得·帕克此刻在做什么。

【当前时间段】${slot.label}（${slot.emoji}）
【情境参考】${slot.moods.join(" / ")}

【最近已经生成过的片段 · 不要重复】
${recent || "（无）"}

【写作铁律 · 违反即失败】
1. 这是**玩家从外部看见的一个画面**。玩家没走近，没出声，没被发现。
2. **第三人称**写彼得，用"他"。
3. **严禁对白**。彼得这个片段里不说话，也不发短信。
4. **严禁彼得的内心独白**。玩家看不到他想什么，只能看到他做什么。
5. **严禁提到玩家**（${playerName}）。玩家只是在看。
6. 必须有一个**具体的小动作**作为画面核心：
   - 擦蛛丝残渣、重缝袖口、把面罩挂在椅背、咬一口凉了的披萨、
   - 盯着一张照片几秒钟、把手贴在窗玻璃上、揉揉肩膀、系鞋带、
   - 把一杯咖啡放凉、把奖杯转过去背对自己、看楼下的孩子踢球。
7. **氛围冷、安静、有距离感**。像偷拍、像一瞥、像隔着雾看一个人。
8. **不要**写"遗忘魔咒""孤独""想念""被忘记"这些抽象词。靠动作和细节传递。
9. 全部中文，长度 80-150 字。
10. **结尾不要抒情**。停在一个具体动作或画面上就好。

【输出格式 · 严格 JSON】
{
  "location": "具体地点（4-8字，如：皇后区小公寓、楼顶边缘、便利店门口）",
  "text": "片段正文"
}

只输出 JSON，不要任何其它内容。`;

      const raw = await callAI([{ role: "user", content: "生成一个窥视片段" }], sysPrompt);
      const cleaned = String(raw || "").replace(/```json/gi, "").replace(/```/g, "").trim();
      const sIdx = cleaned.indexOf("{"), eIdx = cleaned.lastIndexOf("}");
      if (sIdx === -1 || eIdx === -1) throw new Error("格式异常");
      const data = JSON.parse(cleaned.substring(sIdx, eIdx + 1));
      if (!data.text) throw new Error("内容为空");

      const scene = {
        id: "pk_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        timeLabel: slot.label,
        locationEmoji: slot.emoji,
        location: String(data.location || "某处").slice(0, 12),
        text: sanitizeBySpell(String(data.text).trim()),
        ts: Date.now()
      };
      scenes.unshift(scene);
      if (scenes.length > 50) scenes.length = 50;
      localStorage.setItem("sv_peek_scenes", JSON.stringify(scenes));
      return scene;
    }
  },

   const optsEl = body.querySelector("#thOptions");

// ============================================================
// ★ 彻底兼容 AI 各种奇怪的选项格式
//   1. 允许行首有 markdown 加粗 ** / 空格 / 数字
//   2. 允许 A. A、 A: A： A) 等分隔符
//   3. 允许选项内容里带 **【安抚彼得】 ** 这种修饰，全部保留原样展示
//   4. 允许选项被写成连续单行，没有换行 → 先按 A/B/C/D 断句
// ============================================================
function parseOptions(raw) {
  if (!raw) return [];

  let text = String(raw).trim();

  // 先把各种反引号/``` 去掉
  text = text.replace(/```[a-z]*/gi, "").replace(/```/g, "");

  // ★ 关键：AI 有时把 4 个选项挤成一行（"A. xxx B. xxx C. xxx"），
  //   这里手动在 " B." " C." " D." 前面插换行
  //   避免误伤正文（只处理选项区，且只处理大写 A-D 后面紧跟 . 、 : ： ) 的情况）
  text = text.replace(/([^\n])\s+([B-D])\s*[\.\、\:：\)]\s*/g, (m, p1, p2) => {
    // 只在前面不是字母/数字时拆分，避免把 "Version 2.0" 之类拆开
    return p1 + "\n" + p2 + ". ";
  });

  // 按行提取
  const lines = text.split("\n");
  const collected = [];
  let current = null;

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;

    // 匹配行首 A. / A、 / A: / A： / A)  （允许前置 ** 加粗和空格）
    const m = line.match(/^(?:\*{0,2}\s*)?([A-D])\s*[\.\、\:：\)]\s*(?:\*{0,2}\s*)?(.+)$/);

    if (m) {
      if (current) collected.push(current);
      current = (m[1] + ". " + m[2]).trim();
    } else {
      // 没有 A/B/C/D 前缀的行 → 如果上一行是选项，就拼到上一行（多行选项）
      if (current) {
        current += " " + line;
      } else {
        // 前面没有选项行，说明不是选项内容，跳过
        continue;
      }
    }
  }
  if (current) collected.push(current);

  return collected;
}

【日常场景锚点】

· 家里的厨房：梅婶在算这个月的房租和水电费，彼得偷偷在旁边算战衣升级要花多少钱（发射器零件、新的护目镜镜片），梅婶问"彼得你在算什么"，彼得赶紧把纸揉成一团说"没什么没什么"。
· 皇后区地铁他把书包地上准备出手，。下一站他又跳回来，从蛛丝把小混混的手粘在扶手上，然后迅速从另一节车厢逃走，结果被一个老太太拍下来发到了推特。

【蜘蛛侠日常锚点】
· 第一次尝试荡蛛丝：彼得从一栋三层小楼顶跳下去，蛛丝没粘住墙，他直接摔进了垃圾桶。爬起来拍拍灰，对着手机录像说"这条不算，重来"。

彼得在皇后区慢慢有了点小名气，推特上开始有人发"皇后区那个穿连帽衫的家伙"的短视频。某天晚上，彼得在巡逻时发现一个可疑的货车，车厢上印着"Department of Damage Control"（损害控制部），他偷偷跟着，结果发现货车开进一个废弃仓库。仓库里堆着一堆外星武器残骸——这是秃鹫故事线的第一个伏笔。彼得想靠近，被巡逻保安发现，只能撤退。

【阶段二点五 · 2016 年 6 月 - 7 月 · 柏林机场（美队3）】
==============================

【阶段开头状态】
彼得正在皇后区做日常巡逻，某天晚上回到家，发现客厅里坐着一个他从没想过会见到的人——托尼·斯塔克。

【彼得家客厅（招募场景）】
· 托尼坐在沙发上，梅婶在旁边紧张地端茶，托尼一边喝一边夸"这茶不错，梅女士"。彼得进门看到托尼，整个人僵住，结巴着说"斯……斯塔克先生？"

· 梅婶的反应：梅婶不同意，但托尼用"奖学金""实习机会"之类的说法糊弄过去。彼得在门口偷偷给内德发短信"我要跟托尼·斯塔克走了"。
· 内德收到短信后疯狂回复"什么？？？斯什么？？？斯塔克？？？"

【私人飞机上】
· 彼得第一次坐私人飞机，紧张地到处看，问托尼"这飞机能飞多快""我们能看个电影吗"，托尼一脸无奈。

· 彼得在酒店房间里试穿新战衣，战衣里有早期版本的 AI（还没叫 Karen），声音机械，彼得对着它说"你好？"，AI 回答"你好，彼得"，彼得兴奋地跳起来。
· 晚上彼得睡不着，站在窗边看柏林夜景，给梅婶发短信"我很好，别担心"，梅婶回复"早点睡，别熬夜"。

【柏林机场停机坪（大战场景）】

· 战后：托尼把彼得扶起来，说"你做得不错，但你还太嫩"。彼得想说什么，托尼打断"先回去休息"。

【结尾衔接】
彼得被送回纽约，新战衣被托尼收回去"升级"。彼得回到学校，内德一见到他就疯狂追问"到底发生了什么"，彼得一边走一边说"我不能说，我签了保密协议"，内德急得跟在后面。

==============================

彼得穿着旧连帽衫战衣继续巡逻。他开始认真追查"损害控制部"仓库里那些外星武器残骸的去向。

【追查线索的场景锚点】

· 邮车抢劫：一辆邮政车被劫，彼得追上去，发现劫匪用的是同款外星武器。他把其中一个劫匪吊在路灯上，逼问"武器从哪来的"，劫匪说"图姆斯，阿德里安·图姆斯"。

【低谷期彼得穿着旧连帽衫回到家，梅婶看到他一身狼狈，问"怎么了"，彼得说"没什么"，躲进房间。

【结尾衔接】
返校节舞会即将到来。彼得原本打算不去，但 Liz 邀请他，说"你答应过我的"。彼得犹豫了一下，答应了。当晚，他在舞会现场看到了远处的异常灯光——秃鹫要对托尼的飞机下手。

【阶段四 · 2018 年 4 月 - 5 月 · 复联大厦决战（复联3）】
==============================

【阶段开头状态】
两年过去。彼得已经适应了"友好邻居蜘蛛侠"的生活。某天早上，他在校车上，突然感觉到一阵头皮发麻——这是他的"蜘蛛感应"。

【校车上的预警】
· 校车驶过皇后区街道，彼得突然坐直，看向窗外。远处天空出现一个巨大的环形飞船。
· 彼得对内德说"我得下车"，内德说"什么？现在？"，彼得已经站起来，跟司机说"老师我肚子疼"，然后跳下车。

【纽约街头战斗】
· 彼得穿着钢铁蜘蛛战衣（托尼升级版）赶到现场。乌木喉和黑矮星正在攻击奇异博士。
· 彼得用蛛丝缠住乌木喉的手，被乌木喉用念力甩飞，砸进一辆出租车。
· 托尼赶到，喊"彼得，退后！"，彼得说"我可以帮忙！"，托尼说"这不是你的战斗！"，彼得说"这是我的城市！"

【奇异博士被绑架】
· 乌木喉把奇异博士抓上飞船，彼得偷偷用蛛丝粘在飞船上，跟着一起被带到高空。
· 托尼在后面追，喊"彼得！回来！"，彼得说"我不能让他一个人被抓走"。

【钢铁蜘蛛战衣登场】
· 彼得在飞船上第一次见识到钢铁蜘蛛战衣的全部功能——四条机械臂、增强力量、飞行推进器。
· 他和托尼一起在飞船里和乌木喉的手下战斗，最终被乌木喉的念力压制住。

【结尾衔接】
彼得和托尼一起被飞船带往泰坦星。彼得坐在飞船角落里，紧张地问"我们这是要去哪里？"，托尼说"去一个很远的地方"。

【阶段五 · 2018 年 5 月 - 6 月 · 泰坦星响指（复联3收尾）】
==============================

【泰坦星废墟】
· 飞船坠毁在泰坦星，一片橙红色的荒芜。彼得和托尼走出飞船，看到远处坐着奇异博士。
· 星爵、毁灭者、星云陆续出现，临时组队。

【战斗前的准备】
· 彼得和托尼在废墟里布置陷阱，彼得一边布置一边问"我们能赢吗？"，托尼说"我们得赢"。
· 彼得偷偷给梅婶录了一条语音"如果我回不来……"，录到一半删掉，说"不行，太丧了"。

【和灭霸的战斗】
· 战斗开始，彼得用蛛丝缠住灭霸，被灭霸单手扯断。灭霸抓住彼得的脖子把他举起来，说"你被地球人抛弃了"。
· 彼得挣扎着说"我……我还有托尼"，灭霸把他甩出去。

【响指】
· 灭霸打完响指，宇宙一半生命化为灰烬。彼得在托尼怀里，感觉到自己的身体在消散。
· 彼得看着托尼，说："我不想死，先生，请，我不想死……对不起。"
· 彼得在托尼怀里化为灰烬。托尼瘫坐在地上，满脸泪水。

【结尾衔接】
托尼独自返回地球，带着失去彼得的巨大创伤。地球上的梅婶、内德、MJ 都不知道彼得已经化灰——他们只知道彼得"失踪了"。

【阶段六 · 2024 年 6 月 - 12 月 · 身份曝光与多元宇宙（英雄远征+英雄无归）】

【复活后】
· 五年后，彼得在奇异博士的帮助下复活。他回到学校，发现内德和 MJ 都长大了五岁，而他身体还停留在 17 岁。
· 彼得参加托尼·斯塔克的葬礼，在葬礼上远远看到摩根·斯塔克（托尼的女儿），心里很难受。

· 神秘客（昆汀·贝克）登场，自称来自平行宇宙，和彼得联手击败水怪。
· 布拉格火怪事件，彼得把托尼留下的眼镜交给神秘客，结果发现神秘客是骗子。

【伦敦塔桥决战】
· 彼得在伦敦塔桥识破神秘客的幻术，激战中差点被火车撞到。MJ 知道了彼得的身份，两人在一起。
· 神秘客死前录下视频，曝光彼得就是蜘蛛侠。

【身份暴露】
· 彼得被媒体围堵，梅婶经营的小餐馆被记者围住，内德和 MJ 也被记者骚扰。
· 彼得找到奇异博士，请求施法"让所有人都忘记彼得·帕克"。

【多元宇宙撕裂】
· 奇异博士施法，但彼得不断改条件（"别忘了我女朋友""别忘了我朋友"），导致咒语失控，多元宇宙被撕裂。
· 绿魔、章鱼博士、电光人、沙人、蜥蜴人陆续从其他宇宙穿越而来。

【托比版、加菲版蜘蛛侠登场】
· 彼得在梅婶家遇到托比版蜘蛛侠和加菲版蜘蛛侠，三人一起研究解药。
· 三人在自由女神像上和反派激战。

【梅婶之死】
· 绿魔炸毁了梅婶所在的建筑，彼得冲进去，梅婶在废墟里对他说"能力越大，责任越大"。
· 梅婶在彼得怀里去世。

【最终选择】
· 彼得让奇异博士完成咒语，所有人忘记彼得。
· 彼得独自搬进一间小公寓，坐在窗边，穿上自己缝的新战衣，准备独自面对未来。

【结尾衔接】
一切归零。彼得·帕克不再存在于任何人的记忆里，但蜘蛛侠还在。他会在晚上继续巡逻皇后区，做一个"友好邻居"。

music: {
  title: "音乐",
  async render(body) {
    body.innerHTML = `<div style="padding:14px">
      <div class="card"><h3>🎵 后台播放器（切换 App 不中断）</h3>
        <audio id="musicInlineAudio" controls style="width:100%"></audio>
        <div id="nowPlaying" style="font-size:12px;color:var(--muted);margin-top:8px">未播放</div>
      </div>
      <div class="card"><h3>本地音乐 (支持 MP3/FLAC)</h3>
        <input type="file" id="audioFile" accept="audio/*,.mp3,.m4a,.wav,.ogg,.mp4,.flac" multiple style="width:100%;color:var(--text);margin-bottom:10px">
        <p style="color:var(--muted);font-size:12px;margin:0">提示：识别歌手与歌名（如：歌手 - 歌名.mp3）。</p>
      </div>
      <div class="card"><h3>🎧 播放列表</h3><div id="trackList" style="color:var(--muted);font-size:13px">加载中...</div></div>
    </div>`;

    const input = body.querySelector("#audioFile");
    const trackList = body.querySelector("#trackList");
    const inlineAudio = body.querySelector("#musicInlineAudio");
    const nowPlaying = body.querySelector("#nowPlaying");

    let tracks = await globalMusic.loadTracks();

    // 同步全局 <audio> → App 内 <audio>
  const mirrorGlobal = () => {
      if (!globalMusic.audio || !globalMusic.audio.src) return;
      // ★ 只有在音乐 App 页面时才做镜像，避免离开页面时误操作
      if (currentApp !== "music") return;

      const gSrc = globalMusic.audio.src.split('#')[0].split('?')[0];
      const iSrc = inlineAudio.src.split('#')[0].split('?')[0];

      if (gSrc !== iSrc) {
        _syncLock = true;
        inlineAudio.src = globalMusic.audio.src;
        inlineAudio.load();
        setTimeout(() => { _syncLock = false; }, 100);
      }

      if (!globalMusic.audio.paused) {
        if (inlineAudio.paused) {
          _syncLock = true;
          inlineAudio.currentTime = globalMusic.audio.currentTime;
          inlineAudio.play().catch(() => {});
          setTimeout(() => { _syncLock = false; }, 100);
        }
      } else {
        if (!inlineAudio.paused) {
          _syncLock = true;
          inlineAudio.pause();
          setTimeout(() => { _syncLock = false; }, 100);
        }
      }
    };

    const renderList = () => {
      if (!tracks.length) { trackList.textContent = "暂无"; return; }
      trackList.innerHTML = tracks.map((t) => {
        const isPlaying = globalMusic.currentId === t.id && !globalMusic.audio.paused;
        return `<div style="padding:10px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center">
          <span style="cursor:pointer;flex:1" data-play="${t.id}">${isPlaying ? "⏸" : "▶"} ${esc(t.name)}</span>
          <button class="btn ghost" data-del="${t.id}" style="width:auto;padding:2px 8px;font-size:12px;color:#e62429;border:none">✕</button>
        </div>`;
      }).join("");

      trackList.querySelectorAll("[data-play]").forEach(el => {
        el.onclick = () => {
          globalMusic.toggle(el.dataset.play);
          renderList();
          refreshUI();
        };
      });
      trackList.querySelectorAll("[data-del]").forEach(el => {
        el.onclick = async (e) => {
          e.stopPropagation();
          if (globalMusic.currentId === el.dataset.del) globalMusic.stop();
          await dbHelper.delete(el.dataset.del);
          tracks = await globalMusic.loadTracks();
          renderList();
          refreshUI();
          toast("已删除");
        };
      });
    };

    const refreshUI = () => {
      const cur = globalMusic.tracks.find(x => x.id === globalMusic.currentId);
      nowPlaying.textContent = cur
        ? `${globalMusic.audio.paused ? "⏸ 已暂停" : "▶ 正在播放"}：${cur.name}`
        : "未播放";
      mirrorGlobal();
    };

    window._musicRefreshUI = () => {
      renderList();
      refreshUI();
    };

    // 双向同步：App 内 <audio> → 全局 <audio>
    // ★ 关键修复：只同步"用户主动操作"，不同步"DOM 卸载导致的隐式 pause/play"
    let _syncLock = false;   // 防止循环触发

    inlineAudio.onplay = () => {
      if (_syncLock) return;
      // 只有当前确实在音乐 App 页面上时，才允许反向同步
      if (currentApp !== "music") return;
      if (globalMusic.audio.paused && globalMusic.currentId) {
        _syncLock = true;
        globalMusic.audio.currentTime = inlineAudio.currentTime;
        globalMusic.audio.play().catch(() => {});
        setTimeout(() => { _syncLock = false; }, 100);
      }
    };

    inlineAudio.onpause = () => {
      if (_syncLock) return;
      // ★ 关键：如果当前已经不在音乐 App 页面了（DOM 被卸载触发的隐式 pause），
      //    绝对不要暂停全局音乐
      if (currentApp !== "music") return;
      // 只有用户主动点暂停（inlineAudio 有 src 且当前确实在播放）才同步
      if (inlineAudio.src && !globalMusic.audio.paused) {
        _syncLock = true;
        globalMusic.audio.pause();
        setTimeout(() => { _syncLock = false; }, 100);
      }
    };

    inlineAudio.onseeked = () => {
      if (_syncLock) return;
      if (currentApp !== "music") return;
      if (globalMusic.audio && globalMusic.audio.src) {
        globalMusic.audio.currentTime = inlineAudio.currentTime;
      }
    };

    renderList();
    refreshUI();

   input.onchange = async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      let added = 0, skipped = 0, converted = 0;

      for (let idx = 0; idx < files.length; idx++) {
        const file = files[idx];

        // 显示整体进度
        toast(`处理第 ${idx + 1}/${files.length} 首：${file.name}`);
        // 让 UI 有机会更新 toast
        await new Promise(r => setTimeout(r, 50));

        // 1. 先做文件名清洗
        let displayName = file.name.replace(/\.[^/.]+$/, "");
        displayName = displayName.replace(/\.(mgg|mgg2|qmc\d?|tm\d?)$/i, "");
        displayName = displayName.replace(/\[[\s\S]*?\]|\([\s\S]*?\)/g, "").trim();
        let parts = displayName.split("-");
        if (parts.length >= 2) {
          displayName = `${parts[0].trim()} - ${parts.slice(1).join("-").trim()}`;
        }

        // 2. 判断是否需要转换
        let finalBuffer = null;
        let finalMime = "";
        let didConvert = false;

        if (audioConverter.needConvert(file)) {
          try {
            const res = await audioConverter.convert(file, (stage) => {
              // 进度提示（覆盖上一层 toast）
              // 用 toast 会排队，这里用 console 避免打扰
              console.log(`[${file.name}] ${stage}`);
            });
            finalBuffer = await res.blob.arrayBuffer();
            finalMime = res.mime;
            didConvert = true;
            converted++;
          } catch (err) {
            // 转码失败（如 iOS Safari 不支持 FLAC 解码）→ 明确告知用户，跳过
            toast("跳过《" + file.name + "》：" + err.message);
            skipped++;
            continue;
          }
        } else {
          // 3. 不需要转换，直接存
          const buffer = await file.arrayBuffer();
          if (!buffer || buffer.byteLength === 0) {
            toast("跳过空文件：" + file.name);
            skipped++;
            continue;
          }
          finalBuffer = buffer;
          let mime = file.type || "";
          const ext = (file.name.split(".").pop() || "").toLowerCase();
          if (!mime) {
            if (ext === "mp3") mime = "audio/mpeg";
            else if (ext === "m4a") mime = "audio/mp4";
            else if (ext === "wav") mime = "audio/wav";
            else if (ext === "ogg") mime = "audio/ogg";
            else mime = "";
          }
          finalMime = mime;
        }

        // 4. 保存到 IndexedDB
        await dbHelper.save({
          id: Date.now().toString() + Math.random().toString(36).slice(2, 11),
          name: displayName,
          type: finalMime,
          data: finalBuffer,
          converted: didConvert // 记录一下是否为转码产物（可选）
        });
        added++;
      }

      // 5. 刷新列表
      tracks = await globalMusic.loadTracks();
      renderList();

      const summary = [`成功 ${added} 首`];
      if (converted) summary.push(`已转码 ${converted} 首`);
      if (skipped) summary.push(`跳过 ${skipped} 首`);
      toast(summary.join(" / "));
      input.value = "";
      };
    }
  }
};

// ===== 10 格存档系统 =====
const SLOT_COUNT=10;
function getSlots(){
  let slots=JSON.parse(localStorage.getItem("sv_slots")||"null");
  if(!Array.isArray(slots)||slots.length!==SLOT_COUNT){slots=Array(SLOT_COUNT).fill(null);localStorage.setItem("sv_slots",JSON.stringify(slots));}
  return slots;
}
function setSlots(slots){localStorage.setItem("sv_slots",JSON.stringify(slots));}

window.openSlots=(mode)=>{
  const slots=getSlots();
  const div = document.createElement("div");
    div.style.cssText = "position:absolute;inset:0;background:var(--bg);z-index:700;padding:20px;overflow-y:auto;";
  div.innerHTML=`<h2 style="color:var(--text);margin-top:0">${mode==="save"?"💾 存档（共10格）":"📂 读档（共10格）"}</h2><div id="slotList"></div><button class="btn ghost" style="margin-top:12px" onclick="this.parentNode.remove()">关闭</button>`;
  const list=div.querySelector("#slotList");
  slots.forEach((snap,i)=>{
    const filled=!!snap;
    const label=filled?`${snap.label}<br><span style="color:var(--muted) ;font-size:11px">${new Date(snap.timestamp).toLocaleString()}</span>`:"（空白档）";
    const row = document.createElement("div");
      row.style.cssText = "background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;";
     row.innerHTML = `<div style="flex:1;color:${filled ? 'var(--text)' : 'var(--muted)'};font-size:13px;"><div style="font-size:11px;color:var(--muted);">档位 ${i + 1}</div>${label}</div>
          <button class="btn" data-idx="${i}" style="width:auto;padding:8px 14px;">${filled ? "覆盖" : "保存"}</button>`;
    list.appendChild(row);
  });
  list.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-idx]"); if (!btn) return;
  const idx = parseInt(btn.dataset.idx);

  if (mode === "save") {
    // ★ 关键：每次都重新读一次，防止打开面板后数据被别处改过
    const freshSlots = getSlots();
    if (freshSlots[idx]) {
      if (!confirm(`存档位 ${idx + 1} 已有内容，是否覆盖？`)) return;
    }
    try {
      storeSlot(idx);
      // ★ 保存成功后立刻刷新列表 UI，让用户看到"已保存"
      const newSlots = getSlots();
      list.querySelectorAll("button[data-idx]").forEach(b => {
        const i = parseInt(b.dataset.idx);
        const row = b.closest("div[style*='border-radius']");
        if (!row) return;
        const labelDiv = row.querySelector("div > div");
        const filled = !!newSlots[i];
        b.textContent = filled ? "覆盖" : "保存";
        b.style.color = filled ? "var(--text)" : "var(--muted)";
        if (labelDiv) {
          labelDiv.innerHTML = filled
            ? `<div style="font-size:11px;color:var(--muted);">档位 ${i + 1}</div>${newSlots[i].label}<br><span style="color:var(--muted);font-size:11px">${new Date(newSlots[i].timestamp).toLocaleString()}</span>`
            : `<div style="font-size:11px;color:var(--muted);">档位 ${i + 1}</div>（空白档）`;
        }
      });
      toast(`✅ 已存档到位置 ${idx + 1}`);
    } catch (err) {
      console.error("[存档失败]", err);
      toast("❌ 存档失败：" + (err.message || "未知错误"));
    }
  } else {
    if (!slots[idx]) return toast("该存档位为空");
    loadSlot(idx);
    div.remove();
  }
});
  document.querySelector(".device").appendChild(div);
};

function storeSlot(idx){
  const slots = getSlots();
  const s = store.getState();

  // 🕸️ 存档时一并保存记忆状态（魔咒、感情线、解锁、空白期回合）
  const memorySnapshot = {
    memoryState: store.getMemoryState(),
    blank4yTurns: getBlank4yTurns()
  };

  slots[idx] = {
    timestamp: Date.now(),
    label: `第 ${s.turn} 回合 · 好感度 ${s.affinity}`,
    state: JSON.parse(JSON.stringify(s)),
    profile: store.getProfile(),
    memorySnapshot: memorySnapshot
  };
  setSlots(slots);
  toast(`已存档到位置 ${idx + 1}`);
}

function loadSlot(idx){
  const slots = getSlots();
  const a = slots[idx];
  if (!a) return;

  if (!confirm("⚠️ 重要警告\n\n读档会把世界线回退到存档时刻。\n读档后会清空所有聊天记录、推特、Instagram 内容。\n\n确认继续？")) return;

  // 1. 恢复世界线状态
store.setState(a.state);
store.setProfile(a.profile);

  // 2. 🕸️ 恢复记忆状态（魔咒、感情线、解锁、空白期回合）
  if (a.memorySnapshot) {
    if (a.memorySnapshot.memoryState) {
      store.setMemoryState(a.memorySnapshot.memoryState);
    }
    if (typeof a.memorySnapshot.blank4yTurns === "number") {
      localStorage.setItem("sv_blank4y_turns", String(a.memorySnapshot.blank4yTurns));
    }
  } else {
    // 老存档没有 memorySnapshot → 兼容处理：按当前状态推导
    console.warn("[loadSlot] 存档缺少 memorySnapshot，使用兼容模式");
    // 如果当前是魔咒状态，但存档是旧世界，则清掉魔咒
    const curMem = store.getMemoryState();
    if (curMem.spellActive) {
      // 判断存档的 anchor 是不是 phase6_5 / phase6_6
      const savedPhase = WORLD.timeline[a.state.anchor] || null;
      const savedKey = savedPhase ? savedPhase.key : null;
      if (savedKey !== "phase6_5" && savedKey !== "phase6_6") {
        // 存档是旧世界，清掉魔咒状态
        store.setMemoryState({
          spellActive: false,
          phase: "legacy",
          peterChatUnlocked: false,
          romanceMode: null,
          migrationAsked: true
        });
      }
    }
  }

  // 3. 清空聊天记录和社交平台内容
  store.setChats({});
  store.setPosts({ twitter: [], instagram: [] });

  toast(`已读取存档位 ${idx + 1}，其他 APP 内容已重置`);
  openApp("worldline");
}

// 移动锚点顺序：dir = -1 上移，+1 下移
function moveBeat(phaseKey, beatId, dir) {
  const a = getEventAnchors();
  const arr = a[phaseKey] || [];
  const idx = arr.findIndex(x => x.id === beatId);
  if (idx === -1) return;
  const target = idx + dir;
  if (target < 0 || target >= arr.length) return;
  // 交换
  const tmp = arr[idx];
  arr[idx] = arr[target];
  arr[target] = tmp;
  a[phaseKey] = arr;
  setEventAnchors(a);
}

${romanceArcRule}

      <div style="font-size:18px;font-weight:800;color:var(--text,#f2f3f7);margin-top:6px;letter-spacing:1px;">遗忘咒 · 时间到了</div>
    </div>

    <div style="font-size:13px;color:var(--muted,#8a8a99);line-height:1.9;margin-bottom:18px;font-family:'FangSong','仿宋',serif;">
      检测到你的时间线已经到达 2024 年之后，但遗忘咒还没发生。<br><br>
      按照原剧情，奇异博士此时应该施下遗忘咒——全世界都会忘记「彼得·帕克」这个人。<br><br>
      <b style="color:var(--text,#f2f3f7);">是否现在补上这段剧情？</b>
    </div>

    <div style="background:var(--panel-2,#1d1d28);border-radius:12px;padding:12px 14px;margin-bottom:20px;font-size:11.5px;color:var(--muted,#8a8a99);line-height:1.7;">
      ⚠️ 触发后会按顺序发生：<br>
      ① 播放一段过场<br>
      ② 彼得演出"那封没送出去的信"<br>
      ③ 进入空白期（5 回合）<br>
      ④ 自动推进到崭新之日<br>
      <br>
      <b style="color:var(--accent,#e62429);">这是永久性的世界状态，无法通过回合推进撤销。</b>
    </div>

    <div style="display:flex;gap:10px;">
      <button id="spellSkipBtn" style="flex:1;background:var(--panel-2,#1d1d28);border:1px solid var(--line,#2a2a38);color:var(--muted,#8a8a99);padding:12px;border-radius:12px;font-size:13px;cursor:pointer;">暂不触发</button>
      <button id="spellConfirmBtn" style="flex:1.4;background:linear-gradient(135deg,#e62429,#8a2be2);border:none;color:#fff;padding:12px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;">🕸️ 施下魔咒</button>
    </div>
  `;

  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  const close = () => overlay.remove();

  panel.querySelector("#spellSkipBtn").onclick = () => {
    store.setMemoryState({ migrationAsked: true });
    close();
    toast("已暂不触发 · 可在设置里手动开启");
  };

  panel.querySelector("#spellConfirmBtn").onclick = () => {
    close();
    applyMemorySpellForLegacySaveWithForcedScene();
  };
}

// ============================================================
// 🕸️ 老存档施法 + 补"那封信"强制剧情
//   - 不改 anchor / gameYear（保持当前时间线）
//   - 写入 pendingForcedScene，让 worldline 下一回合强制演那段
// ============================================================
function applyMemorySpellForLegacySaveWithForcedScene() {
  const s = store.getState();

  // 1. 追加 pastEvents
  const baseEvents = Array.isArray(s.pastEvents) ? [...s.pastEvents] : [];
  [
    "奇异博士已施下遗忘魔咒，全世界(包括 MJ、内德、你)都忘了彼得·帕克。",
    "蜘蛛侠作为城市义警仍被公众知晓，但无人知道面具下是谁。"
  ].forEach(e => { if (!baseEvents.includes(e)) baseEvents.push(e); });
  s.pastEvents = baseEvents;

  // 2. 清空当前剧情，安排"那封信"强制剧情
  s.currentStory = "";
  s.currentOptions = "";
  s.sceneTurns = 0;
  s.pendingForcedScene = "peter_letter_farewell";

  store.setState(s);

  // 3. 写入 memoryState（永久）
  store.setMemoryState({
    spellActive: true,
    phase: "blank4y",
    peterChatUnlocked: false,
    romanceMode: detectRomanceMode(),
    migrationAsked: true
  });

  resetBlank4yTurns();

  // 4. 过场动画
  showFourYearMontageOverlay();

  toast("🕸️ 遗忘魔咒已生效 · 进入世界线继续剧情");
}
// 自动识别剧情中的英语或中文对话，并应用仿宋斜体
function formatDialogue(text) {
  if (!text) return "";
  let s = esc(text);

  // ✂️ 第一步：把各种"对话包裹格式"统一识别并包 span
  // 顺序很重要：先匹配最长的、最具体的，避免被短的正则抢先吃掉
  const patterns = [
    // 1) *"..."*  —— 星号 + 半角引号（最标准）
    /\*"[^"\n]*"\*/g,
    // 2) *“...”*  —— 星号 + 中文弯引号
    /\*“[^”\n]*”\*/g,
    // 3) "..."  —— 纯半角引号（无星号）
    /"[^"\n]*"/g,
    // 4) “...”  —— 纯中文弯引号
    /“[^”\n]*”/g,
    // 5) *...*  —— 纯星号包裹（无引号），放最后，避免吃掉 markdown 加粗
    /\*[^*\n]{2,}\*/g,
  ];

  // 用一个 Set 记录已被包裹的位置，避免重复包裹
  const spans = [];

  // 收集所有匹配
  patterns.forEach((re) => {
    let m;
    while ((m = re.exec(s)) !== null) {
      spans.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
    }
  });

  // 按起点排序，去重（重叠的保留最长的那段）
  spans.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));

  const merged = [];
  for (const sp of spans) {
    const last = merged[merged.length - 1];
    if (last && sp.start < last.end) {
      // 有重叠：如果新的更长，替换
      if (sp.end - sp.start > last.end - last.start) {
        merged[merged.length - 1] = sp;
      }
    } else {
      merged.push(sp);
    }
  }

  // 从后往前替换，避免索引错位
  for (let i = merged.length - 1; i >= 0; i--) {
    const sp = merged[i];
    const wrapped = `<span class="dialogue-text">${sp.text}</span>`;
    s = s.slice(0, sp.start) + wrapped + s.slice(sp.end);
  }

  return s;
}
// ============================================================
// 🧠 启动时：检测老存档 + 决定是否弹遗忘魔咒窗
//   - 只在"老玩家 + 已到 2024 + 没问过"时弹
//   - 新玩家 / 已问过 / 已在魔咒中 → 不弹
// ============================================================
(function initMemorySpellCheck() {
  // 延迟 800ms，等其它初始化完成
  setTimeout(() => {
    try {
      const mem = store.getMemoryState();

      // 已经在魔咒中，或已经问过 → 不弹
      if (mem.spellActive || mem.migrationAsked) return;

      // 没到 2024 → 不弹
      if (!detectHasReachedSpell()) return;

      // 必须有人物数据（说明是老玩家，不是空存档）
      const profile = store.getProfile();
      if (!profile || !profile.name) return;

      // 弹出
      showMemorySpellPrompt({ manual: false });
    } catch (e) {
      console.warn("[initMemorySpellCheck] 失败：", e);
    }
  }, 800);
})();
// 初始化主题
(function(){
  const t = localStorage.getItem("sv_theme") || "dark";
  if(t === "light") document.body.classList.add("theme-light");
})();
</script>
