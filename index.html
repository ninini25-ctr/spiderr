﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>蜘蛛侠世界模拟器</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0a0a0f; --panel:#14141c; --panel-2:#1d1d28; --text:#f2f3f7; --muted:#8a8a99; --line:#2a2a38;
  --accent:#e62429; --accent-2:#2d6bff;
  --safe-bottom:env(safe-area-inset-bottom, 20px);
  --font-size-base: 14px;
  --font-size-small: 12px;
  --font-main: "SimSun", "宋体", serif;
  --font-dialogue: "FangSong", "仿宋", "STFangsong", serif;

  /* ===== 新增：组件级颜色变量（黑版默认） ===== */
  --header-title-color:#ffffff;        /* 标题栏标题 */
  --card-title-color:#ffffff;          /* 卡片标题 */
  --sidebar-title-color:#e62429;       /* 支线标题 */
  --dialogue-color:#c9d1e8;            /* 对话文字颜色 */
  --refresh-color:#5b8dff;             /* 刷新按钮颜色 */
  --bubble-me-bg:#2d6bff;              /* 我的气泡背景 */
  --bubble-them-bg:#1d1d28;            /* 对方气泡背景 */
  --bubble-them-text:#f2f3f7;
  --app-header-bg:rgba(20,20,28,.9);
  --sidebar-text-color:#e0e0e0;
--input-comment-bg:#222222;          /* 评论输入框背景 */
  --input-comment-text:#f2f3f7;        /* 评论输入框文字 */
}

/* ===== 白版配色：重新设计 ===== */
body.theme-light {
  --bg:#f5f5f7; --panel:#ffffff; --panel-2:#f0f0f5; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#e62429; --accent-2:#007aff;

  /* 组件级颜色：白版专属 */
  --header-title-color:#1d1d1f;        /* 标题栏标题：黑色 */
  --card-title-color:#1d1d1f;          /* 卡片标题：黑色 */
  --sidebar-title-color:#e62429;       /* 支线标题：红色（醒目） */
  --dialogue-color:#5e5e63;            /* 对话文字：深灰蓝，与正文区分 */
  --refresh-color:#007aff;             /* 刷新按钮：蓝色 */
  --bubble-me-bg:#007aff;              /* 我的气泡：蓝色 */
  --bubble-them-bg:#e8e8ed;            /* 对方气泡：浅灰 */
  --bubble-them-text:#1d1d1f;
  --app-header-bg:rgba(255,255,255,.95);
  --sidebar-text-color:#3a3a3f;
  --input-comment-bg:#f0f0f5;          /* 评论输入框：浅灰，与卡片融合 */
  --input-comment-text:#1d1d1f;        /* 评论输入框文字：黑色 */
}
body{
  display:flex; align-items:center; justify-content:center;
  height:100vh; height:100dvh;
  padding: 0; margin: 0;
  overflow: auto;
}
/* 手机端：满屏显示 */
.device{
  position:relative; width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
  background:var(--bg); overflow:hidden; display:flex; flex-direction:column;
  transition: background 0.3s;
  margin: 0 auto;
}

@media (min-width: 500px) {
  .device {
    width: 390px; height: 844px;
    max-height: 95vh;
    border-radius: 44px;
    box-shadow: 0 0 0 10px #111, 0 0 60px rgba(230,36,41,.25);
    flex-shrink: 0;
  }
  body.theme-light .device {
    box-shadow: 0 0 0 10px #e5e5ea, 0 0 60px rgba(0,0,0,.15);
  }
}
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;z-index:40;color:var(--text);font-weight:600;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:44px;}
.screen.active{display:flex;}
#desktop .wallpaper{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 25% 15%, rgba(230,36,41,.55), transparent 55%),
    radial-gradient(circle at 85% 85%, rgba(120,10,15,.65), transparent 60%),
    radial-gradient(circle at 50% 50%, rgba(60,0,8,.4), transparent 70%),
    linear-gradient(160deg, #1a0508 0%, #0d0204 40%, #000000 100%);
  backdrop-filter: blur(0px);
}
/* 毛玻璃质感层 */
#desktop .wallpaper::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.05) 0%, transparent 40%, rgba(230,36,41,.06) 100%);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  pointer-events:none;
  mix-blend-mode: overlay;
}
#desktop .app-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px;padding:70px 22px;align-content:start;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:var(--text);font-size:11px;cursor:pointer;}
.app-icon:active{transform:scale(.9);}
.app-icon span{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(145deg,#2a2a38,#16161f);box-shadow:0 6px 14px rgba(0,0,0,.4);}
/* 桌面底部水印 */
.desktop-watermark{
  position:absolute;
  bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  left:50%;
  transform:translateX(-50%);
  font-family: "FangSong", "仿宋", "STFangsong", serif;
  font-size:13px;
  font-weight:500;
  color:rgba(255,255,255,.55);
  letter-spacing:2px;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  pointer-events:none;
  z-index:3;
  user-select:none;
}
.app-icon label{
  color:#eee;
  text-shadow:0 1px 2px #000;
  font-family: "FangSong", "仿宋", "FangSong_GB2312", "STFangsong", serif;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.app-header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background: var(--app-header-bg);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);min-height:48px;z-index:10;
}
.back-btn{background:none;border:none;color:var(--accent-2);font-size:30px;padding:0 6px;cursor:pointer;}
.app-header h1{
  font-size:17px;margin:0;flex:1;text-align:center;font-weight:600;
  color: var(--header-title-color);
}
.app-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;position:relative;padding-bottom:env(safe-area-inset-bottom, 0px);}
.app-body::-webkit-scrollbar{width:0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
.card h3{margin:0 0 12px;font-size:15px;color: var(--card-title-color);}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label{font-size:12px;color:var(--muted);}
.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;width:100%;}
.btn{background:var(--accent-2);border:none;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;cursor:pointer;width:100%;}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line);}
.btn:disabled{opacity:.5;}
.row{display:flex;gap:8px;align-items:center;}
#chatThread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(90px + env(safe-area-inset-bottom, 0px));background-size:cover;background-position:center;}
.bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.bubble.me{
  align-self:flex-end;background:var(--bubble-me-bg);
  border-bottom-right-radius:4px;color:var(--text);
}
.bubble.them{
  align-self:flex-start;background:var(--bubble-them-bg);
  border-bottom-left-radius:4px;color: var(--bubble-them-text);
}
.bubble.voice-bubble {
  background: var(--bubble-me-bg);
  color: #fff;
  padding: 10px 14px;
}
.bubble.them.voice-bubble {
  background: var(--bubble-them-bg);
  color: var(--bubble-them-text);
}
.bubble.voice-bubble:active {
  opacity: 0.85;
}
.composer{display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line);position:absolute;bottom:0;left:0;right:0;padding-bottom:calc(15px + env(safe-area-inset-bottom, 15px));z-index:20;}
.composer input{flex:1;background:var(--panel-2);border:none;border-radius:20px;padding:10px 14px;color:var(--text);outline:none;font-size:14px;}
.composer button{background:var(--accent-2);border:none;color:var(--text);border-radius:20px;padding:0 16px;font-weight:600;cursor:pointer;}
.tweet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
.tweet .head{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.tweet .name{font-weight:700;font-size:14px;}
.tweet .handle{color:var(--muted);font-size:12px;}
.tweet .text{font-size:14px;line-height:1.5;white-space:pre-wrap;margin-bottom:8px;}
.tweet .foot{display:flex;gap:16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px;}
.comment{font-size:13px;line-height:1.4;padding:4px 0;color:var(--text);}
.comment b{color:var(--muted);font-weight:normal;}
.story-content{
  font-size:14px;line-height:1.7;white-space:pre-wrap;margin-bottom:20px;
  color: var(--sidebar-text-color);
}
.switch{position:relative;display:inline-block;width:44px;height:24px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#333;transition:.4s;border-radius:24px;}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:white;transition:.4s;border-radius:50%;}
input:checked + .slider{background-color:var(--accent-2);}
input:checked + .slider:before{transform:translateX(20px);}
.toast{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,42,.95);color:#ffffff;
  padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
body.theme-light .toast{
  background:rgba(255,255,255,.98);color:#1d1d1f;
  border:1px solid #d2d2d7;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.toast.show{opacity:1;}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:13px;gap:10px;}
.spin{width:24px;height:24px;border:3px solid #333;border-top-color:var(--accent-2);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.banner {
  position: absolute;
  top: 50px;
  left: 10px;
  right: 10px;
  background: rgba(30,30,42,.95);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  z-index: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
  transform: translateY(-100px);
  opacity: 0;
  transition: transform .35s, opacity .35s;
  backdrop-filter: blur(20px);
  cursor: pointer;
}
.banner.show {
  transform: translateY(0);
  opacity: 1;
}
.banner .banner-icon {
  width: 36px;height: 36px;border-radius: 10px;
  background: var(--accent-2);display: flex;align-items: center;justify-content: center;
  font-size: 20px;flex-shrink: 0;
}
.banner .banner-body { flex: 1; min-width: 0; }
.banner .banner-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.banner .banner-text { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 对话类专用 */
.dialogue-text {
  font-family: var(--font-dialogue);
  font-style: italic;
  font-size: calc(var(--font-size-base) - 1px);
  color: var(--dialogue-color);
  opacity: 0.95;
}
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:28px;background:#000;
  border-radius:0 0 18px 18px;z-index:50;
  transition: background 0.3s;
}
body.theme-light .notch{ background:#1d1d1f; }
</style>
</head>

const dbHelper = {
  db: null,
  async init() {
    return new Promise((resolve) => {
      const req = indexedDB.open("SpiderMusicDB", 1);
      req.onupgradeneeded = e => { e.target.result.createObjectStore("tracks", { keyPath: "id" }); };
      req.onsuccess = e => { this.db = e.target.result; resolve(); };
      req.onerror = () => resolve();
    });
  },
  async save(track) {
  if (!this.db) await this.init();
  return new Promise((resolve, reject) => {
    try {
      const tx = this.db.transaction("tracks", "readwrite");
      const req = tx.objectStore("tracks").put(track);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e);
      tx.onabort = (e) => reject(new Error("事务被中止"));
    } catch (e) { reject(e); }
  });
},
  async getAll() {
    if (!this.db) await this.init();
    return new Promise((resolve) => {
      const tx = this.db.transaction("tracks", "readonly");
      const req = tx.objectStore("tracks").getAll();
      req.onsuccess = () => resolve(req.result || []);
    });
  },
  async delete(id) {
    if (!this.db) await this.init();
    return new Promise((resolve) => {
      const tx = this.db.transaction("tracks", "readwrite");
      tx.objectStore("tracks").delete(id);
      tx.oncomplete = () => resolve();
    });
  }
};
dbHelper.init(); // 初始化数据库

const audioConverter = {
  // 选择当前浏览器支持的最佳输出格式
  pickMime() {
    const candidates = [
      "audio/mpeg",           // 真 MP3（Chrome 113+）
      "audio/webm;codecs=opus", // WebM Opus（绝大多数现代浏览器）
      "audio/webm",
      "audio/ogg;codecs=opus",
      "audio/ogg"
    ];
    if (typeof MediaRecorder === "undefined") return null;
    for (const m of candidates) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return null;
  },

  // 判断是否是需要转换的格式（浏览器能否直接播）
  needConvert(file) {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    // 只对 flac / wav（体积太大） / ogg 做转换，mp3/m4a 已经最好，直接存
    if (ext === "flac") return true;
    if (ext === "wav") return true;
    if (ext === "ogg" && !file.type.includes("opus")) return true;
    return false;
  },

  // 用 WebAudio 解码 + MediaRecorder 重编码
  // 返回 Promise<{blob, mime, ext}>
  async convert(file, onProgress) {
    const targetMime = this.pickMime();
    if (!targetMime) {
      throw new Error("当前浏览器不支持 MediaRecorder，无法转换");
    }

    // 1. 解码
    onProgress && onProgress("解码中...");
    const arrayBuffer = await file.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) throw new Error("当前浏览器不支持 WebAudio，无法转换");

    const ctx = new AudioCtx();
    let audioBuffer;
    try {
      audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
    } catch (e) {
      await ctx.close();
      throw new Error("当前浏览器无法解码该音频（如 iOS Safari 不支持 FLAC），请换 MP3/M4A 文件");
    }

    // 2. 编码：用一个 MediaStreamDestination 把 AudioBuffer 喂给 MediaRecorder
    onProgress && onProgress("编码中...");
    const duration = audioBuffer.duration;
    const sampleRate = audioBuffer.sampleRate;
    const channels = Math.min(audioBuffer.numberOfChannels, 2);
    const frameCount = audioBuffer.length;

    // 手动分块播放 + 录制，避免 WebAudio 一次全局播放
    const dest = ctx.createMediaStreamDestination();
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(dest);
    // 不能连到 ctx.destination，否则会边转码边外放
    // 但某些浏览器要求必须 link 到 destination 才能"跑"，我们连一个静音 gain
    const silentGain = ctx.createGain();
    silentGain.gain.value = 0;
    source.connect(silentGain);
    silentGain.connect(ctx.destination);

    const recorder = new MediaRecorder(dest.stream, { mimeType: targetMime });
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

    const donePromise = new Promise((resolve, reject) => {
      recorder.onstop = () => {
        try {
          const blob = new Blob(chunks, { type: targetMime });
          const ext = targetMime.includes("mpeg") ? "mp3"
                    : targetMime.includes("webm") ? "webm"
                    : targetMime.includes("ogg") ? "ogg"
                    : "bin";
          resolve({ blob, mime: targetMime, ext });
        } catch (e) { reject(e); }
      };
      recorder.onerror = (e) => reject(e.error || new Error("MediaRecorder 编码失败"));
    });

    recorder.start();
    source.start(0);

    // 等待播放结束（比 audioBuffer.duration 略长一点保险）
    await new Promise((resolve) => {
      source.onended = resolve;
      // 保险：如果 onended 没触发，duration + 1 秒后强制停
      setTimeout(resolve, (duration + 1) * 1000);
    });
    // 给 recorder 一点时间冲最后一块数据
    await new Promise(r => setTimeout(r, 300));
    recorder.stop();
    const result = await donePromise;

    await ctx.close();
    return result;
  }
};

const globalMusic = {
  audio: null,
  currentId: null,
  tracks: [],

  init() {
    this.audio = document.getElementById("globalMusicPlayer");
    // 恢复上次播放位置（可选）
    const saved = JSON.parse(localStorage.getItem("sv_music_state") || "null");
    if (saved) this.currentId = saved.id;
  },

  async loadTracks() {
    this.tracks = await dbHelper.getAll();
    return this.tracks;
  },

   play(id) {
    const t = this.tracks.find(x => x.id === id);
    if (!t) return;
    if (this._lastUrl) URL.revokeObjectURL(this._lastUrl);

    let blob;
    try {
      blob = t.type ? new Blob([t.data], { type: t.type }) : new Blob([t.data]);
    } catch (e) {
      return toast("数据异常：" + e.message);
    }

    const url = URL.createObjectURL(blob);
    this._lastUrl = url;

    // ⚠️ 关键修复：不要 removeAttribute + load()，
    // 直接设置 src 即可。removeAttribute + load() 会触发一次异步 onerror
    // 导致误报"无法播放"。
    this.audio.onerror = null;   // 先解绑旧回调
    this.audio.pause();
    this.audio.src = url;
    this.audio.load();

    // 重新绑定错误处理（只处理本次播放的真实错误）
    const handleError = () => {
      const err = this.audio.error;
      let msg = "无法播放（浏览器可能不支持该音频编码）";
      if (err) {
        if (err.code === 1) msg = "播放被中止";
        if (err.code === 2) msg = "网络/解码错误";
        if (err.code === 3) msg = "解码失败";
        if (err.code === 4) msg = "格式不支持：浏览器无法解码该音频";
      }
      toast(msg);
    };
    this.audio.addEventListener("error", handleError, { once: true });

    this.audio.play().catch(e => {
      toast("播放失败：" + (e.message || e.name));
    });

    this.currentId = id;
    localStorage.setItem("sv_music_state", JSON.stringify({ id }));
    this._notifyUI();
  },

  pause() { this.audio.pause(); this._notifyUI(); },

  stop() {
    this.audio.pause();
    this.audio.currentTime = 0;
    this._notifyUI();
  },

  toggle(id) {
    if (this.currentId === id && !this.audio.paused) {
      this.pause();
    } else {
      this.play(id);
    }
  },

  _notifyUI() {
    // 如果当前在音乐 App，刷新 UI
    if (currentApp === "music" && window._musicRefreshUI) {
      window._musicRefreshUI();
    }
  }
};

async function callAI(messages, systemPrompt) {
  const cfg = store.getConfig();
  if (!cfg.enabled) throw new Error("AI 未启用");
  if (!cfg.apiKey) throw new Error("请先填入 API Key");
  const url = (cfg.baseUrl||"https://api.openai.com/v1").replace(/\/+$/,"") + "/chat/completions";
  const res = await fetch(url, {method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.apiKey},body:JSON.stringify({model:cfg.model,messages:[{role:"system",content:systemPrompt},...messages],temperature:0.85})});
  if (!res.ok) throw new Error("API 报错: "+res.status);
  return (await res.json()).choices[0].message.content.trim();
}

async function generateImage(prompt) {
  const cfg = store.getConfig();
  const key = cfg.imgApiKey || cfg.apiKey;
  const url = (cfg.imgBaseUrl||"https://api.openai.com/v1").replace(/\/+$/,"") + "/images/generations";
  const res = await fetch(url, {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:cfg.imgModel||"dall-e-3", prompt:prompt, n:1, size:"1024x1024"})
  });
  if (!res.ok) throw new Error("生图失败: "+res.status);
  const data = await res.json();
  const item = data.data[0];

  // 如果直接返回的是 URL
  if (item.url) return item.url;

  // 如果返回的是 base64，转成 Blob URL
  if (item.b64_json) {
    const bin = atob(item.b64_json);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: "image/png" });
    return URL.createObjectURL(blob);
  }

  throw new Error("AI 返回的图片格式无法解析");
}

// ===== 时间推进工具 =====
function addDays(year, month, day, add) {
  const d = new Date(year, month - 1, day);
  d.setDate(d.getDate() + add);
  return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
}

// 根据当前回合和剧情内容判定是否该推进时间 / 切阶段
function shouldAdvancePhase(s, storyText) {
  const phase = WORLD.timeline[s.anchor];
  if (!phase) return false;

  // 1. 记录当前场景内的回合数（每 5 回合自动切场景）
  s.sceneTurns = (s.sceneTurns || 0) + 1;

  // 2. 检测剧情中是否明确写了时间变化
  const timeJumpKeywords = /(第二天|次日|隔天|几小时后|第二天早上|第二天晚上|周末|过了几天|几天后|一周后|下周|第二周|一个月后)/;
  const isTimeJump = timeJumpKeywords.test(storyText);

  // 3. 如果没到 5 回合，且剧情没有时间跳跃，就不推进时间
  if (s.sceneTurns < 5 && !isTimeJump) {
    return false;
  }

  // 4. 触发时间推进（此时可能是 sceneTurns 累计到 5 或剧情明确跳跃）
  let addDaysCount = 0;
  if (isTimeJump) {
    // 剧情明确跳跃，根据关键词判断跳跃幅度
    if (/一个月|一个月后/.test(storyText)) addDaysCount = 30;
    else if (/一周后|下周/.test(storyText)) addDaysCount = 7;
    else if (/几天后|过了几天/.test(storyText)) addDaysCount = 3;
    else if (/第二天|次日|隔天/.test(storyText)) addDaysCount = 1;
    else addDaysCount = 1; // 默认 +1 天
  } else {
    // 累积 5 回合同场景结束，大跳跃 1-3 天
    addDaysCount = 1 + Math.floor(Math.random() * 3);
  }

  const next = addDays(s.gameYear, s.gameMonth, s.gameDay, addDaysCount);
  s.gameYear = next.year;
  s.gameMonth = next.month;
  s.gameDay = next.day;
  s.sceneTurns = 0; // 重置场景回合数

  // 5. 判断是否超出当前阶段末月（阶段推进）
  const [m1, m2] = phase.monthRange;
  if (s.gameYear === phase.year && s.gameMonth > m2) {
    if (s.anchor < WORLD.timeline.length - 1) {
      s.anchor += 1;
      const np = WORLD.timeline[s.anchor];
      s.gameYear = np.year;
      s.gameMonth = np.monthRange[0];
      s.gameDay = 1;
      return true;
    }
  }
  // 如果年份已经超过阶段末年份，也进入下一阶段
  if (s.gameYear > phase.year) {
    if (s.anchor < WORLD.timeline.length - 1) {
      s.anchor += 1;
      const np = WORLD.timeline[s.anchor];
      s.gameYear = np.year;
      s.gameMonth = np.monthRange[0];
      s.gameDay = 1;
      return true;
    }
  }
  return false;
}

// 推进支线一轮
window.advanceSideQuest = async (id, choice) => {
  const q = WORLD.getSideQuests().find(x => x.id === id);
  if (!q || q.closed) return toast("该支线已完结");

  q.choices = q.choices || [];
  q.choices.push({ story: q.story, choice });
  q.affinity = q.affinity || 0;

  // 渲染 loading
  const body = $("#appBody");
  body.innerHTML = `<div class="loader"><div class="spin"></div>剧情推进中...</div>`;

  try {
    const sNow = store.getState();
    const date = `${sNow.gameYear}年${sNow.gameMonth}月${sNow.gameDay}日`;
    const last = q.choices[q.choices.length - 1];

    const sysPrompt = buildSystem(`你正在续写一段**支线剧情**（独立于主线）。

【支线标题】${q.title}
【当前游戏内日期】${date}
【已推进轮数】${q.choices.length}
【上一轮剧情】${last.story.slice(0, 800)}
【玩家选择】${choice}

【要求】
1. 承接上一轮剧情和玩家选择继续发展，写 400-800 字。
2. 结尾用【选项】列出 A. B. C. D.。
3. **不要在任何位置标注好感度变动**（支线不影响主线好感度）。
4. **如果这一轮剧情已经可以自然收尾，在末尾另写一行**：**【支线完结】**
   不要拖太长，支线一般 2-4 轮完结，最多 5 轮。

【风格】电影镜头感，纽约皇后区，严禁 AI 腔。`);

    const res = await callAI([{role:"user",content:"继续"}], sysPrompt);
    const isFinished = /【支线完结】/.test(res);
    const optionsIdx = res.indexOf("【选项】");
    const storyText = (optionsIdx > -1 ? res.slice(0, optionsIdx) : res)
      .replace("【剧情】","").replace(/【好感度变动:\s*[+-]\d+】/g, "").replace("【支线完结】","").trim();
    const optionsText = optionsIdx > -1 ? res.slice(optionsIdx + 4).replace("【支线完结】","").trim() : "";

   // 更新支线记录（不改好感度）
    q.story = storyText;
    q.options = optionsText;
    q.closed = isFinished || q.choices.length >= 5;

    WORLD.updateSideQuest(id, q);

    // 如果完结，自动封档
    if (q.closed) {
      toast("🎬 支线已完结：" + q.title);
      setTimeout(() => openApp("Spider_Terminal"), 800);
    } else {
      renderSideQuestBody(body, q);
    }
  } catch (e) {
    body.innerHTML = `<div style="padding:14px"><div class="card">失败: ${esc(e.message)}</div></div>`;
  }
};

// ===== 删除单条消息（安全版：用最新数据 + 索引校验 + try/catch）=====
window.deleteMessage = function(userName, idx) {
  try {
    if (!userName) { toast("聊天对象无效"); return; }

    // 每次都从 localStorage 取最新，绝不使用渲染时的旧引用
    const chats = store.getChats();
    const arr = chats[userName];
    if (!Array.isArray(arr)) { toast("聊天记录不存在"); return; }

    const i = parseInt(idx);
    if (!Number.isInteger(i) || i < 0 || i >= arr.length) {
      toast("消息已不存在，正在刷新");
      apps.messages.render(document.getElementById("appBody"));
      return;
    }

    arr.splice(i, 1);
    chats[userName] = arr;
    store.setChats(chats);

    // 重新渲染当前聊天
    apps.messages.render(document.getElementById("appBody"));
  } catch (err) {
    console.error("deleteMessage 失败:", err);
    toast("删除失败：" + (err.message || "未知错误"));
    // 兜底：强制重渲染，恢复到与数据一致的状态
    try { apps.messages.render(document.getElementById("appBody")); } catch (_) {}
  }
};

window.selectOption = (optText) => {
  if (!optText || !optText.trim()) return toast("请输入内容");
  const s = store.getState();
  if (!s.currentStory) return;
  s.history = s.history || [];
  s.history.push({ story: s.currentStory, choice: optText });
  s.currentStory = ""; s.currentOptions = ""; s.turn += 1;

 // ===== 剧情时间推进（同场景不跳，场景切换才跳）=====
// 注意：此时 s.currentStory 已经被 push 到 history，但我们要判断的是玩家刚选完的这段剧情（即 history 最后一条）
const lastTurnStory = s.history[s.history.length - 1] ? s.history[s.history.length - 1].story : "";
const advanced = shouldAdvancePhase(s, lastTurnStory);

if (advanced) {
  const np = WORLD.timeline[s.anchor];
  toast(`时间推进：进入「${np.name}」（${np.year}年${np.monthRange[0]}月）`);
} else if (s.sceneTurns === 0) {
  // 刚刚 sceneTurns 被重置，说明刚触发跳跃
  toast(`时间推进：${s.gameYear}年${s.gameMonth}月${s.gameDay}日`);
} else {
  toast(`场景内推进（不改变时间）: ${s.gameYear}年${s.gameMonth}月${s.gameDay}日`);
}

  store.setState(s);
  openApp('worldline');
};

const isChinese = (s) => /[\u4e00-\u9fa5]/.test(s);
// 去除「中文（中文）」里的重复括号翻译
const cleanTranslation = (s) => {
  // 形如 "这是中文（这是中文）" 或 "这是中文（翻译）" 都合并
  const m = s.match(/^(.+?)（(.+)）$/);
  if (!m) return s;
  const before = m[1].trim();
  const inside = m[2].trim();
  // 如果括号外是中文，且括号内也是中文，就去掉括号翻译
  if (isChinese(before) && isChinese(inside)) return before;
  return s;
};

music: {
  title: "音乐",
  async render(body) {
    body.innerHTML = `<div style="padding:14px">
      <div class="card"><h3>🎵 后台播放器（切换 App 不中断）</h3>
        <audio id="musicInlineAudio" controls style="width:100%"></audio>
        <div id="nowPlaying" style="font-size:12px;color:var(--muted);margin-top:8px">未播放</div>
      </div>
      <div class="card"><h3>本地音乐 (支持 MP3/FLAC)</h3>
        <input type="file" id="audioFile" accept="audio/*,.mp3,.m4a,.wav,.ogg,.mp4,.flac" multiple style="width:100%;color:var(--text);margin-bottom:10px">
        <p style="color:var(--muted);font-size:12px;margin:0">提示：识别歌手与歌名（如：歌手 - 歌名.mp3）。</p>
      </div>
      <div class="card"><h3>🎧 播放列表</h3><div id="trackList" style="color:var(--muted);font-size:13px">加载中...</div></div>
    </div>`;

    const input = body.querySelector("#audioFile");
    const trackList = body.querySelector("#trackList");
    const inlineAudio = body.querySelector("#musicInlineAudio");
    const nowPlaying = body.querySelector("#nowPlaying");

    let tracks = await globalMusic.loadTracks();

    // 同步全局 <audio> → App 内 <audio>
  const mirrorGlobal = () => {
      if (!globalMusic.audio || !globalMusic.audio.src) return;
      const gSrc = globalMusic.audio.src.split('#')[0].split('?')[0];
      const iSrc = inlineAudio.src.split('#')[0].split('?')[0];
      
      // 只有当 src 确实不同的时候，才去替换
      if (gSrc !== iSrc) {
        inlineAudio.src = globalMusic.audio.src;
        inlineAudio.load(); // 强制重新加载新源
      }
      
      // 如果全局在播放，但 App 内没播放，才去触发 play
      if (!globalMusic.audio.paused) {
        if (inlineAudio.paused) {
          inlineAudio.currentTime = globalMusic.audio.currentTime;
          inlineAudio.play().catch(()=>{});
        }
      } else {
        if (!inlineAudio.paused) inlineAudio.pause();
      }
    };

    const renderList = () => {
      if (!tracks.length) { trackList.textContent = "暂无"; return; }
      trackList.innerHTML = tracks.map((t) => {
        const isPlaying = globalMusic.currentId === t.id && !globalMusic.audio.paused;
        return `<div style="padding:10px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center">
          <span style="cursor:pointer;flex:1" data-play="${t.id}">${isPlaying ? "⏸" : "▶"} ${esc(t.name)}</span>
          <button class="btn ghost" data-del="${t.id}" style="width:auto;padding:2px 8px;font-size:12px;color:#e62429;border:none">✕</button>
        </div>`;
      }).join("");

      trackList.querySelectorAll("[data-play]").forEach(el => {
        el.onclick = () => {
          globalMusic.toggle(el.dataset.play);
          renderList();
          refreshUI();
        };
      });
      trackList.querySelectorAll("[data-del]").forEach(el => {
        el.onclick = async (e) => {
          e.stopPropagation();
          if (globalMusic.currentId === el.dataset.del) globalMusic.stop();
          await dbHelper.delete(el.dataset.del);
          tracks = await globalMusic.loadTracks();
          renderList();
          refreshUI();
          toast("已删除");
        };
      });
    };

    const refreshUI = () => {
      const cur = globalMusic.tracks.find(x => x.id === globalMusic.currentId);
      nowPlaying.textContent = cur
        ? `${globalMusic.audio.paused ? "⏸ 已暂停" : "▶ 正在播放"}：${cur.name}`
        : "未播放";
      mirrorGlobal();
    };

    window._musicRefreshUI = () => {
      renderList();
      refreshUI();
    };

    // 双向同步：App 内 <audio> → 全局 <audio>
    inlineAudio.onplay = () => {
      if (globalMusic.audio.paused && globalMusic.currentId) {
        globalMusic.audio.currentTime = inlineAudio.currentTime;
        globalMusic.audio.play().catch(()=>{});
      }
    };
    inlineAudio.onpause = () => {
      if (!globalMusic.audio.paused) globalMusic.audio.pause();
    };
    inlineAudio.onseeked = () => {
      globalMusic.audio.currentTime = inlineAudio.currentTime;
    };

    renderList();
    refreshUI();

   input.onchange = async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      let added = 0, skipped = 0, converted = 0;

      for (let idx = 0; idx < files.length; idx++) {
        const file = files[idx];

        // 显示整体进度
        toast(`处理第 ${idx + 1}/${files.length} 首：${file.name}`);
        // 让 UI 有机会更新 toast
        await new Promise(r => setTimeout(r, 50));

        // 1. 先做文件名清洗
        let displayName = file.name.replace(/\.[^/.]+$/, "");
        displayName = displayName.replace(/\.(mgg|mgg2|qmc\d?|tm\d?)$/i, "");
        displayName = displayName.replace(/\[[\s\S]*?\]|\([\s\S]*?\)/g, "").trim();
        let parts = displayName.split("-");
        if (parts.length >= 2) {
          displayName = `${parts[0].trim()} - ${parts.slice(1).join("-").trim()}`;
        }

        // 2. 判断是否需要转换
        let finalBuffer = null;
        let finalMime = "";
        let didConvert = false;

        if (audioConverter.needConvert(file)) {
          try {
            const res = await audioConverter.convert(file, (stage) => {
              // 进度提示（覆盖上一层 toast）
              // 用 toast 会排队，这里用 console 避免打扰
              console.log(`[${file.name}] ${stage}`);
            });
            finalBuffer = await res.blob.arrayBuffer();
            finalMime = res.mime;
            didConvert = true;
            converted++;
          } catch (err) {
            // 转码失败（如 iOS Safari 不支持 FLAC 解码）→ 明确告知用户，跳过
            toast("跳过《" + file.name + "》：" + err.message);
            skipped++;
            continue;
          }
        } else {
          // 3. 不需要转换，直接存
          const buffer = await file.arrayBuffer();
          if (!buffer || buffer.byteLength === 0) {
            toast("跳过空文件：" + file.name);
            skipped++;
            continue;
          }
          finalBuffer = buffer;
          let mime = file.type || "";
          const ext = (file.name.split(".").pop() || "").toLowerCase();
          if (!mime) {
            if (ext === "mp3") mime = "audio/mpeg";
            else if (ext === "m4a") mime = "audio/mp4";
            else if (ext === "wav") mime = "audio/wav";
            else if (ext === "ogg") mime = "audio/ogg";
            else mime = "";
          }
          finalMime = mime;
        }

        // 4. 保存到 IndexedDB
        await dbHelper.save({
          id: Date.now().toString() + Math.random().toString(36).slice(2, 11),
          name: displayName,
          type: finalMime,
          data: finalBuffer,
          converted: didConvert // 记录一下是否为转码产物（可选）
        });
        added++;
      }

      // 5. 刷新列表
      tracks = await globalMusic.loadTracks();
      renderList();

      const summary = [`成功 ${added} 首`];
      if (converted) summary.push(`已转码 ${converted} 首`);
      if (skipped) summary.push(`跳过 ${skipped} 首`);
      toast(summary.join(" / "));
      input.value = "";
      };
    }
  }
};

// ===== 10 格存档系统 =====
const SLOT_COUNT=10;
function getSlots(){
  let slots=JSON.parse(localStorage.getItem("sv_slots")||"null");
  if(!Array.isArray(slots)||slots.length!==SLOT_COUNT){slots=Array(SLOT_COUNT).fill(null);localStorage.setItem("sv_slots",JSON.stringify(slots));}
  return slots;
}
function setSlots(slots){localStorage.setItem("sv_slots",JSON.stringify(slots));}

window.openSlots=(mode)=>{
  const slots=getSlots();
  const div=document.createElement("div");
  div.style.cssText="position:absolute;inset:0;background:#000e;z-index:300;padding:20px;overflow-y:auto;";
  div.innerHTML=`<h2 style="color:var(--text);margin-top:0">${mode==="save"?"💾 存档（共10格）":"📂 读档（共10格）"}</h2><div id="slotList"></div><button class="btn ghost" style="margin-top:12px" onclick="this.parentNode.remove()">关闭</button>`;
  const list=div.querySelector("#slotList");
  slots.forEach((snap,i)=>{
    const filled=!!snap;
    const label=filled?`${snap.label}<br><span style="color:var(--muted) ;font-size:11px">${new Date(snap.timestamp).toLocaleString()}</span>`:"（空白档）";
    const row=document.createElement("div");
    row.style.cssText="background:#14141c;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;";
    row.innerHTML=`<div style="flex:1;color:${filled?'#fff':'#666'};font-size:13px"><b>存档位 ${i+1}</b><br>${label}</div><button class="btn" data-idx="${i}" style="width:auto;padding:8px 14px">${filled?(mode==="save"?"覆盖":"读取"):(mode==="save"?"保存":"不可用")}</button>`;
    list.appendChild(row);
  });
  list.addEventListener("click",(e)=>{
    const btn=e.target.closest("button[data-idx]"); if(!btn) return;
    const idx=parseInt(btn.dataset.idx);
    if(mode==="save"){
      if(slots[idx]&&!confirm(`存档位 ${idx+1} 已有内容，是否覆盖？`)) return;
      storeSlot(idx); div.remove();
    } else {
      if(!slots[idx]) return toast("该存档位为空");
      loadSlot(idx); div.remove();
    }
  });
  document.querySelector(".device").appendChild(div);
};

function storeSlot(idx){
  const slots=getSlots(), s=store.getState();
  slots[idx]={timestamp:Date.now(),label:`第 ${s.turn} 回合 · 好感度 ${s.affinity}`,state:JSON.parse(JSON.stringify(s)),profile:store.getProfile()};
  setSlots(slots); toast(`已存档到位置 ${idx+1}`);
}

function loadSlot(idx){
  const slots=getSlots(), a=slots[idx]; if(!a) return;
  if(!confirm("⚠️ 重要警告\n\n读档会把世界线回退到存档时刻。\n读档后会清空所有聊天记录、推特、Instagram 内容。\n\n确认继续？")) return;
  store.setState(a.state); store.setProfile(a.profile);
  store.setChats({}); store.setPosts({twitter:[],instagram:[]});
  toast(`已读取存档位 ${idx+1}，其他 APP 内容已重置`);

// ===== 剧情联动：NPC 主动发短信 =====
 async function triggerNpcMessage(storyContext) {
  const contacts = store.getContacts();
  if (!contacts || contacts.length === 0) return;

  try {
    const sNow = store.getState();
    const dateHint = `【当前游戏内日期】${sNow.gameYear}年${sNow.gameMonth}月${sNow.gameDay}日。短信内容必须符合这个时间点，不能出现未来事物。\n\n`;
    const sysPrompt = buildSystem(`${dateHint}根据以下刚刚发生的剧情，判断哪个角色（从联系人列表中选择：${contacts.map(c => c.name).join(", ")}）会主动给玩家发短信。
【当前剧情】
${storyContext.slice(0, 800)}

【要求】
1. 选出一个最合理的角色。
2. 生成 1 到 3 条短信内容，口语化，符合角色性格和当前情境。
3. 严格输出 JSON 格式，不要任何解释：{"sender": "联系人名字", "messages": ["短信1", "短信2"]}`);

    const res = await callAI([{role:"user", content:"分析并生成短信"}], sysPrompt);
    const match = res.match(/\{[\s\S]*\}/);
    if (!match) return;

    const data = JSON.parse(match[0]);
    if (!data.sender || !data.messages || !data.messages.length) return;

    if (!contacts.find(c => c.name === data.sender)) return;

    // ===== 如果玩家正在和这个 sender 聊天，不要重复插入（避免「正在聊天时突然刷屏」） =====
const isCurrentlyChatting = apps.messages.currentUser === data.sender && apps.messages.view === "chat";
if (isCurrentlyChatting) {
  // 直接在当前聊天线程里插入
  const chats0 = store.getChats();
  const arr0 = chats0[data.sender] || [];
  data.messages.forEach(msg => {
    arr0.push({ role: "them", content: msg });
  });
  chats0[data.sender] = arr0;
  store.setChats(chats0);
  // 刷新当前聊天界面
  if (apps.messages.view === "chat") {
    apps.messages.render(document.getElementById("appBody"));
  }
  return;
}

const chats = store.getChats();
const arr = chats[data.sender] || [];

data.messages.forEach(msg => {
  arr.push({ role: "them", content: msg });
});
chats[data.sender] = arr;
store.setChats(chats);

showMsgBanner(data.sender, data.messages[0] || "");
  } catch(e) {
    console.warn("NPC主动发信失败:", e);
  }
}
window.showMsgBanner = (sender, preview) => {
  const el = document.getElementById("msgBanner");
  if (!el) return;
  
  el.innerHTML = `
    <div class="banner-icon">💬</div>
    <div class="banner-body">
      <div class="banner-title">${esc(sender)}</div>
      <div class="banner-text">${esc(preview || "发来了一条新消息")}</div>
    </div>
  `;
  el.classList.add("show");
  
  if (window._bannerTimer) clearTimeout(window._bannerTimer);
  window._bannerTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 10000);
  
  el.onclick = () => {
  el.classList.remove("show");
  clearTimeout(window._bannerTimer);
  // 保存当前聊天对象（如果有）
  const previousUser = apps.messages.currentUser;
  const previousView = apps.messages.view;
  // 切换到这个 NPC
  apps.messages.currentUser = sender;
  apps.messages.view = "chat";
  openApp("messages");
  // 如果用户想返回，可以点「返回」回到列表（不影响之前彼得那边）
  // 不再额外覆盖 previousUser
};
};
// 自动识别剧情中的英语或中文对话，并应用仿宋斜体
function formatDialogue(text) {
  if (!text) return "";
  let safeText = esc(text);
  // 匹配 *"..."* 格式或 “...” 格式
  // 捕获组 1 为 *"..."*，捕获组 2 为 “...”
  safeText = safeText.replace(/(\*".*?"\*)|(“[^”]*”)/g, (match) => {
    return `<span class="dialogue-text">${match}</span>`;
  });
  return safeText;
}

  const t = localStorage.getItem("sv_theme") || "dark";
  if(t === "light") document.body.classList.add("theme-light");
})();
