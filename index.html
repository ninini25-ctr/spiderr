<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>蜘蛛侠世界模拟器</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0a0a0f; --panel:#14141c; --panel-2:#1d1d28; --text:#f2f3f7; --muted:#8a8a99; --line:#2a2a38;
  --accent:#e62429; --accent-2:#2d6bff;
  --safe-bottom:env(safe-area-inset-bottom, 20px);
  --font-size-base: 14px;
  --font-size-small: 12px;
  --font-main: "SimSun", "宋体", serif;
  --font-dialogue: "FangSong", "仿宋", "STFangsong", serif;

  /* ===== 新增：组件级颜色变量（黑版默认） ===== */
  --header-title-color:#ffffff;        /* 标题栏标题 */
  --card-title-color:#ffffff;          /* 卡片标题 */
  --sidebar-title-color:#e62429;       /* 支线标题 */
  --dialogue-color:#c9d1e8;            /* 对话文字颜色 */
  --refresh-color:#5b8dff;             /* 刷新按钮颜色 */
  --bubble-me-bg:#2d6bff;              /* 我的气泡背景 */
  --bubble-them-bg:#1d1d28;            /* 对方气泡背景 */
  --bubble-them-text:#f2f3f7;
  --app-header-bg:rgba(20,20,28,.9);
  --sidebar-text-color:#e0e0e0;
--input-comment-bg:#222222;          /* 评论输入框背景 */
  --input-comment-text:#f2f3f7;        /* 评论输入框文字 */
}

/* ===== 白版配色：重新设计 ===== */
body.theme-light {
  --bg:#f5f5f7; --panel:#ffffff; --panel-2:#f0f0f5; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#e62429; --accent-2:#007aff;

  /* 组件级颜色：白版专属 */
  --header-title-color:#1d1d1f;        /* 标题栏标题：黑色 */
  --card-title-color:#1d1d1f;          /* 卡片标题：黑色 */
  --sidebar-title-color:#e62429;       /* 支线标题：红色（醒目） */
  --dialogue-color:#5e5e63;            /* 对话文字：深灰蓝，与正文区分 */
  --refresh-color:#007aff;             /* 刷新按钮：蓝色 */
  --bubble-me-bg:#007aff;              /* 我的气泡：蓝色 */
  --bubble-them-bg:#e8e8ed;            /* 对方气泡：浅灰 */
  --bubble-them-text:#1d1d1f;
  --app-header-bg:rgba(255,255,255,.95);
  --sidebar-text-color:#3a3a3f;
  --input-comment-bg:#f0f0f5;          /* 评论输入框：浅灰，与卡片融合 */
  --input-comment-text:#1d1d1f;        /* 评论输入框文字：黑色 */
}
/* ===== 白版推特间隔线 ===== */
body.theme-light .tw-tweet {
  border-bottom: 1px solid #d2d2d7;      /* 白版：灰色实线 */
}
body.theme-light .tw-comment-line + .tw-comment-line {
  border-top: 1px dashed rgba(0,0,0,.08);
}
body.theme-light .tw-actions {
  border-top: 1px dashed rgba(0,0,0,.1);
}
body.theme-light .tw-comments-preview {
  background: #f0f0f5;
}
body{
  display:flex; align-items:center; justify-content:center;
  height:100vh; height:100dvh;
  padding: 0; margin: 0;
  overflow: auto;
}
/* 手机端：满屏显示 */
.device{
  position:relative; width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
  background:var(--bg); overflow:hidden; display:flex; flex-direction:column;
  transition: background 0.3s;
  margin: 0 auto;
}

@media (min-width: 500px) {
  .device {
    width: 390px; height: 844px;
    max-height: 95vh;
    border-radius: 44px;
    box-shadow: 0 0 0 10px #111, 0 0 60px rgba(230,36,41,.25);
    flex-shrink: 0;
  }
  body.theme-light .device {
    box-shadow: 0 0 0 10px #e5e5ea, 0 0 60px rgba(0,0,0,.15);
  }
}
.statusbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;z-index:40;color:var(--text);font-weight:600;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:44px;}
.screen.active{display:flex;}
#desktop .wallpaper{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 25% 15%, rgba(230,36,41,.55), transparent 55%),
    radial-gradient(circle at 85% 85%, rgba(120,10,15,.65), transparent 60%),
    radial-gradient(circle at 50% 50%, rgba(60,0,8,.4), transparent 70%),
    linear-gradient(160deg, #1a0508 0%, #0d0204 40%, #000000 100%);
  backdrop-filter: blur(0px);
}
/* 毛玻璃质感层 */
#desktop .wallpaper::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.05) 0%, transparent 40%, rgba(230,36,41,.06) 100%);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  pointer-events:none;
  mix-blend-mode: overlay;
}
#desktop .app-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px;padding:70px 22px;align-content:start;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:var(--text);font-size:11px;cursor:pointer;}
.app-icon:active{transform:scale(.9);}
.app-icon span{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(145deg,#2a2a38,#16161f);box-shadow:0 6px 14px rgba(0,0,0,.4);}
/* 桌面底部水印 */
.desktop-watermark{
  position:absolute;
  bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  left:50%;
  transform:translateX(-50%);
  font-family: "FangSong", "仿宋", "STFangsong", serif;
  font-size:13px;
  font-weight:500;
  color:rgba(255,255,255,.55);
  letter-spacing:2px;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  pointer-events:none;
  z-index:3;
  user-select:none;
}
.app-icon label{
  color:#eee;
  text-shadow:0 1px 2px #000;
  font-family: "FangSong", "仿宋", "FangSong_GB2312", "STFangsong", serif;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.app-header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background: var(--app-header-bg);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);min-height:48px;z-index:10;
}
.back-btn{background:none;border:none;color:var(--accent-2);font-size:30px;padding:0 6px;cursor:pointer;}
.app-header h1{
  font-size:17px;margin:0;flex:1;text-align:center;font-weight:600;
  color: var(--header-title-color);
}
.app-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;position:relative;padding-bottom:env(safe-area-inset-bottom, 0px);min-height:0;}
.app-body::-webkit-scrollbar{width:0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
.card h3{margin:0 0 12px;font-size:15px;color: var(--card-title-color);}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label{font-size:12px;color:var(--muted);}
.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;width:100%;box-sizing:border-box;max-width:100%;}
.btn{background:var(--accent-2);border:none;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;cursor:pointer;width:100%;}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line);}
.btn:disabled{opacity:.5;}
.row{display:flex;gap:8px;align-items:center;}
#chatThread{
  flex:1;
  overflow-y:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:14px;
  background-size:cover;
  background-position:center;
}
.bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.bubble.me{
  align-self:flex-end;background:var(--bubble-me-bg);
  border-bottom-right-radius:4px;color:var(--text);
}
.bubble.them{
  align-self:flex-start;background:var(--bubble-them-bg);
  border-bottom-left-radius:4px;color: var(--bubble-them-text);
}
.bubble.voice-bubble {
  background: var(--bubble-me-bg);
  color: #fff;
  padding: 10px 14px;
}
.bubble.them.voice-bubble {
  background: var(--bubble-them-bg);
  color: var(--bubble-them-text);
}
.bubble.voice-bubble:active {
  opacity: 0.85;
}
.composer{display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line);padding-bottom:calc(15px + env(safe-area-inset-bottom, 15px));z-index:20;}
.composer input{flex:1;background:var(--panel-2);border:none;border-radius:20px;padding:10px 14px;color:var(--text);outline:none;font-size:14px;}
.composer button{background:var(--accent-2);border:none;color:var(--text);border-radius:20px;padding:0 16px;font-weight:600;cursor:pointer;}
.tweet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
.tweet .head{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.tweet .name{font-weight:700;font-size:14px;}
.tweet .handle{color:var(--muted);font-size:12px;}
.tweet .text{font-size:14px;line-height:1.5;white-space:pre-wrap;margin-bottom:8px;}
.tweet .foot{display:flex;gap:16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px;}
.comment{font-size:13px;line-height:1.4;padding:4px 0;color:var(--text);}
.comment b{color:var(--muted);font-weight:normal;}
.story-content{
  font-size:14px;line-height:1.7;white-space:pre-wrap;margin-bottom:20px;
  color: var(--sidebar-text-color);
}
.switch{position:relative;display:inline-block;width:44px;height:24px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#333;transition:.4s;border-radius:24px;}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:white;transition:.4s;border-radius:50%;}
input:checked + .slider{background-color:var(--accent-2);}
input:checked + .slider:before{transform:translateX(20px);}
.toast{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,42,.95);color:#ffffff;
  padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
body.theme-light .toast{
  background:rgba(255,255,255,.98);color:#1d1d1f;
  border:1px solid #d2d2d7;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.toast.show{opacity:1;}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:13px;gap:10px;}
.spin{width:24px;height:24px;border:3px solid #333;border-top-color:var(--accent-2);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.banner {
  position: absolute;
  top: 50px;
  left: 10px;
  right: 10px;
  background: rgba(30,30,42,.95);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  z-index: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
  transform: translateY(-100px);
  opacity: 0;
  transition: transform .35s, opacity .35s;
  backdrop-filter: blur(20px);
  cursor: pointer;
}
.banner.show {
  transform: translateY(0);
  opacity: 1;
}
.banner .banner-icon {
  width: 36px;height: 36px;border-radius: 10px;
  background: var(--accent-2);display: flex;align-items: center;justify-content: center;
  font-size: 20px;flex-shrink: 0;
}
.banner .banner-body { flex: 1; min-width: 0; }
.banner .banner-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.banner .banner-text { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ===== 推特 UI 重绘 ===== */
.tw-wrap { padding: 0; }
.tw-tabs {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.tw-tab {
  padding: 8px 14px; font-size: 14px; font-weight: 600;
  color: var(--muted); cursor: pointer; border-radius: 20px;
  transition: background .2s, color .2s;
  white-space: nowrap;
}
.tw-tab:hover { background: var(--panel-2); color: var(--text); }
.tw-tab-spacer { flex: 1; }
.tw-btn-icon {
  background: none; border: none; color: var(--text);
  font-size: 16px; cursor: pointer; padding: 6px 8px; border-radius: 50%;
}
.tw-btn-icon:hover { background: var(--panel-2); }

.tw-empty {
  padding: 40px 20px; text-align: center;
  color: var(--muted); font-size: 13px;
}

.tw-tweet {
  border-bottom: 1px solid #ffffff33;   
  padding: 18px 16px 20px;        
  transition: background .15s;
}
.tw-tweet:hover { background: rgba(255,255,255,.02); }
.tw-retweet-hint {
  font-size: 12px; color: var(--muted); margin-bottom: 6px;
  padding-left: 44px;
}
.tw-tweet-inner { display: flex; gap: 10px; }
.tw-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--panel-2); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; flex-shrink: 0; font-size: 16px;
}
.tw-content { flex: 1; min-width: 0; }
.tw-head { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.tw-name { font-weight: 700; font-size: 14px; color: var(--text); }
.tw-handle { font-size: 12px; color: var(--muted); }
.tw-text {
  font-size: 14px; line-height: 1.6; color: var(--text);
  margin: 8px 0 12px;              
  white-space: pre-wrap; word-break: break-word;
}
.tw-comments-preview {
  background: var(--panel-2); border-radius: 12px;
  padding: 12px 14px;             
  margin: 10px 0 12px;         
}
.tw-comment-line {
  font-size: 12.5px; color: var(--text);
  padding: 5px 0;       
  line-height: 1.5;
}
.tw-comment-line + .tw-comment-line {
  border-top: 1px dashed rgba(255,255,255,.06); 
}
.tw-comment-line b { color: var(--accent-2); font-weight: 600; }
.tw-more-comments {
  font-size: 12px; color: var(--accent-2); cursor: pointer;
  padding: 4px 0 0 0;
}
.tw-actions {
  display: flex; gap: 6px;
  margin-top: 12px;      
  padding-top: 10px;
  border-top: 1px dashed rgba(255,255,255,.08);
}
.tw-act {
  background: none; border: none; color: var(--muted);
  font-size: 13px; padding: 4px 8px; border-radius: 16px;
  cursor: pointer; display: flex; align-items: center; gap: 4px;
  transition: background .15s, color .15s;
}
.tw-act:hover { background: rgba(45,107,255,.12); color: var(--accent-2); }
.tw-act.liked { color: var(--accent); }
.tw-act.liked:hover { background: rgba(230,36,41,.12); color: var(--accent); }

.tw-comments-full {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--line);
}
.tw-comment-item { margin-bottom: 8px; }
.tw-comment-reply-trigger {
  font-size: 13px; color: var(--text); cursor: pointer;
  padding: 4px 0; line-height: 1.5;
}
.tw-comment-reply-trigger b { color: var(--accent-2); font-weight: 600; }
.tw-replies {
  padding-left: 14px; border-left: 2px solid var(--line);
  margin-top: 2px;
}
.tw-reply-line { font-size: 12px; color: var(--muted); padding: 2px 0; }
.tw-reply-line b { color: var(--text); font-weight: 600; }
.tw-comment-input-row { display: flex; gap: 6px; margin-top: 10px; }
.tw-comment-input {
  flex: 1; background: var(--input-comment-bg); color: var(--input-comment-text);
  border: 1px solid var(--line); border-radius: 20px;
  padding: 8px 14px; font-size: 13px; outline: none;
}
.tw-comment-send {
  background: var(--accent-2); color: #fff; border: none;
  border-radius: 20px; padding: 0 16px; font-weight: 600;
  font-size: 13px; cursor: pointer;
}
/* 对话类专用 */
.dialogue-text {
  font-family: var(--font-dialogue);
  font-style: italic;
  font-size: calc(var(--font-size-base) - 1px);
  color: var(--dialogue-color);
  opacity: 0.95;
}
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:28px;background:#000;
  border-radius:0 0 18px 18px;z-index:50;
  transition: background 0.3s;
}
body.theme-light .notch{ background:#1d1d1f; }
/* ===== 社交圈 App ===== */
.sc-tabs {
  display: flex; gap: 6px;
  background: var(--panel-2);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 14px;
}
.sc-tab {
  flex: 1; padding: 10px 8px;
  text-align: center; font-size: 13px; font-weight: 600;
  color: var(--muted); cursor: pointer; border-radius: 10px;
  transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.sc-tab.active { background: var(--panel); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.sc-tab-count {
  font-size: 10px; background: var(--line); color: var(--muted);
  padding: 1px 6px; border-radius: 8px; font-weight: 500;
}
.sc-tab.active .sc-tab-count { background: var(--accent-2); color: #fff; }

.sc-list { display: flex; flex-direction: column; gap: 8px; }
.sc-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px;
  cursor: pointer; transition: all .15s;
  position: relative;
}
.sc-row:hover { border-color: var(--accent-2); }
.sc-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff; font-weight: 700; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sc-name { font-size: 14px; font-weight: 700; color: var(--text); }
.sc-desc { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-aff-bar {
  margin-top: 6px; height: 4px; background: var(--panel-2);
  border-radius: 2px; overflow: hidden;
}
.sc-aff-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent));
  border-radius: 2px; transition: width .3s;
}
.sc-aff-text { font-size: 10px; color: var(--muted); margin-top: 3px; }
.sc-del-btn {
  background: none; border: none; color: var(--muted);
  font-size: 14px; cursor: pointer; padding: 4px 6px;
  border-radius: 6px; transition: all .15s; flex-shrink: 0;
}
.sc-del-btn:hover { color: var(--accent); background: rgba(230,36,41,.1); }
.sc-empty {
  text-align: center; padding: 32px 16px;
  color: var(--muted); font-size: 13px;
}

.sc-group-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--panel-2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.sc-group-mini-av {
  width: 22px; height: 22px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--panel);
  position: absolute;
}
.sc-group-mini-av:nth-child(1) { top: 2px; left: 2px; }
.sc-group-mini-av:nth-child(2) { top: 2px; right: 2px; }
.sc-group-mini-av:nth-child(3) { bottom: 2px; left: 11px; }
.sc-group-mini-av-letter {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff; font-weight: 700; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
}

/* ===== 号角日报入口卡片 ===== */
.daily-card {
  background: linear-gradient(135deg, #1a1a24 0%, #0f0f15 100%);
  border: 1px solid var(--line);
  border-radius: 16px; padding: 24px 20px;
  text-align: center; position: relative; overflow: hidden;
}
body.theme-light .daily-card {
  background: linear-gradient(135deg, #f5f3eb 0%, #e8e3d5 100%);
}
.daily-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #b8935a, #d4af6e, #b8935a);
}
.daily-logo { font-size: 48px; margin-bottom: 10px; }
.daily-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: 2px; font-family: "SimSun", "宋体", serif; }
.daily-subtitle { font-size: 10px; color: var(--muted); letter-spacing: 3px; margin-top: 4px; font-weight: 600; }
.daily-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 14px 0 20px; }
.daily-btn { padding: 12px 20px !important; font-size: 14px; }

/* 存档列表 */
.daily-saved-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.daily-saved-item {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px;
  cursor: pointer; transition: all .15s;
}
.daily-saved-item:hover { border-color: var(--accent-2); }
.daily-saved-info { flex: 1; min-width: 0; }
.daily-saved-title { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.daily-saved-date { font-size: 11px; color: var(--muted); margin-top: 4px; }
.daily-saved-del { background: none; border: none; color: var(--muted); font-size: 14px; padding: 6px; cursor: pointer; border-radius: 6px; }
.daily-saved-del:hover { color: var(--accent); background: rgba(230,36,41,.1); }

/* 报纸本体 */
.daily-paper {
  background: #f5efdc; border-radius: 12px;
  padding: 18px 14px;
  border: 1px solid #d6c9a8;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
  position: relative;
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  overflow-wrap: break-word;
  word-break: break-word;
  font-family: "FangSong", "仿宋", "STFangsong", "KaiTi", "楷体", "Kaiti SC", serif;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(120,90,50,.012) 3px, rgba(120,90,50,.012) 4px);
}
.daily-paper * {
  font-family: inherit;
  box-sizing: border-box;
  max-width: 100%;
  overflow-wrap: break-word;
  word-break: break-word;
}
.daily-paper-header { text-align: center; border-bottom: 3px double #3a2f1f; padding-bottom: 10px; margin-bottom: 14px; }
.daily-paper-title { font-size: clamp(18px, 5.2vw, 22px); font-weight: 900; letter-spacing: 2px; color: #1a1408; }
.daily-paper-cn { font-size: 13px; font-weight: 800; letter-spacing: 4px; color: #3a2f1f; margin-top: 2px; }
.daily-paper-line { height: 1px; background: #3a2f1f; margin: 8px 20px; }
.daily-paper-meta { font-size: 10px; color: #5a4a30; display: flex; justify-content: center; gap: 6px; letter-spacing: 0.5px; flex-wrap: wrap; line-height: 1.5; }

.daily-headline { text-align: center; padding-bottom: 14px; }
.daily-h1 { font-size: clamp(16px, 4.8vw, 20px); font-weight: 900; color: #1a1408; line-height: 1.4; letter-spacing: 0.5px; margin: 0 0 8px; }
.daily-h1-sub { font-size: clamp(12px, 3.6vw, 14px); color: #3a2f1f; line-height: 1.5; margin: 4px 0 8px; font-weight: 700; }
.daily-h1-body { font-size: clamp(12px, 3.4vw, 13px); line-height: 1.85; color: #2a2010; margin: 0; text-align: justify; }
.daily-divider { text-align: center; font-size: 12px; font-weight: 800; color: #3a2f1f; letter-spacing: 2px; margin: 16px 0 10px; }

.daily-entry { padding: 12px 0; border-bottom: 1px dashed #c9bb96; }
.daily-entry:last-child { border-bottom: none; }
.daily-entry-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.daily-entry-tag { font-size: 9px; font-weight: 700; background: #3a2f1f; color: #f5efdc; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.5px; flex-shrink: 0; }
.daily-entry-title { font-size: clamp(13px, 3.8vw, 14px); font-weight: 800; color: #1a1408; margin: 0; line-height: 1.4; }
.daily-entry-body { font-size: clamp(12px, 3.4vw, 12.5px); line-height: 1.8; color: #2a2010; margin: 0; text-align: justify; }

.daily-paper-footer { margin-top: 18px; text-align: center; }
.daily-footer-line { height: 1px; background: #3a2f1f; margin-bottom: 8px; }
.daily-footer-text { font-size: 9px; color: #5a4a30; letter-spacing: 0.5px; font-style: italic; line-height: 1.5; }
/* ===== 双人日记 ===== */
.diary-wrap { padding: 16px; }
.diary-header { margin-bottom: 16px; }
.diary-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
.diary-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.diary-meta .dot { margin: 0 6px; opacity: 0.5; }

.diary-tabs {
  display: flex; gap: 4px;
  background: var(--panel-2);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 14px;
}
.diary-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.diary-tab.active { background: var(--panel); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.diary-tab .count {
  font-size: 11px; background: var(--line); color: var(--muted);
  padding: 1px 7px; border-radius: 10px; font-weight: 500;
}
.diary-tab.active .count { background: var(--accent-2); color: #fff; }

.diary-actions { display: flex; gap: 8px; margin-bottom: 16px; }
.diary-action-btn {
  flex: 1; padding: 12px; border-radius: 12px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .15s;
}
.diary-action-btn.primary { background: var(--accent-2); color: #fff; }
.diary-action-btn.primary:hover { filter: brightness(1.1); }
.diary-action-btn.subtle { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.diary-action-btn.subtle:hover { color: var(--accent); border-color: var(--accent); }

.diary-list { display: flex; flex-direction: column; gap: 10px; }
.diary-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; cursor: pointer;
  transition: all .15s;
}
.diary-card:hover { border-color: var(--accent-2); transform: translateY(-1px); }
.diary-card-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.diary-card-date { font-size: 11px; color: var(--muted); }
.diary-card-stage { font-size: 11px; color: var(--accent-2); padding: 1px 8px; border-radius: 8px; background: rgba(45,107,255,.1); }
.diary-card-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.diary-card-preview { font-size: 13px; color: var(--muted); line-height: 1.5; }
.diary-card-response {
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
  font-size: 12px; color: var(--accent-2); font-style: italic;
}
.diary-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

.diary-detail {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 24px;
}
.diary-detail-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.5px; }
.diary-detail-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
.diary-detail-content {
  font-size: 14px; line-height: 1.85; color: var(--text);
  white-space: pre-wrap; font-family: "SimSun", "宋体", serif;
}
.diary-detail-response {
  margin-top: 20px; padding: 16px;
  background: var(--panel-2); border-radius: 12px;
  border-left: 3px solid var(--accent-2);
}
.diary-detail-response-label { font-size: 11px; color: var(--accent-2); font-weight: 600; margin-bottom: 8px; }
.diary-detail-response-text { font-size: 13px; line-height: 1.7; color: var(--text); white-space: pre-wrap; }

/* ===== 双人日记 · 4 种纸张背景（只作用于日记卡片/详情页） ===== */
/* 牛皮纸 */
.paper-kraft {
  background-color: #d9c7ae;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(120,90,50,.12) 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(120,90,50,.10) 1px, transparent 1px),
    radial-gradient(circle at 40% 80%, rgba(120,90,50,.08) 1px, transparent 1px),
    linear-gradient(160deg, #e8d7bf 0%, #d9c7ae 50%, #cbb89c 100%);
  background-size: 18px 18px, 26px 26px, 34px 34px, 100% 100%;
  color: #3b2a1a;
  border: 1px solid #b9a385;
  box-shadow: inset 0 0 40px rgba(120,90,50,.15), 0 2px 6px rgba(0,0,0,.08);
}
.paper-kraft .diary-detail-title,
.paper-kraft .diary-detail-content,
.paper-kraft .diary-detail-meta,
.paper-kraft .diary-card-title,
.paper-kraft .diary-card-preview,
.paper-kraft .diary-card-date,
.paper-kraft .diary-card-stage { color: #3b2a1a !important; }

/* 日记本（横线格） */
.paper-notebook {
  background-color: #fbfaf3;
  background-image:
    repeating-linear-gradient(to bottom, transparent 0, transparent 27px, #c9d6e3 27px, #c9d6e3 28px),
    linear-gradient(180deg, #fdfcf6 0%, #f6f3e6 100%);
  color: #2b2b2b;
  position: relative;
  border: 1px solid #d8d2c0;
  box-shadow: 0 2px 6px rgba(0,0,0,.06);
}
.paper-notebook::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 28px;
  width: 1px;
  background: #e0a3a3;
  pointer-events: none;
}
.paper-notebook .diary-detail-title,
.paper-notebook .diary-detail-content,
.paper-notebook .diary-detail-meta,
.paper-notebook .diary-card-title,
.paper-notebook .diary-card-preview,
.paper-notebook .diary-card-date,
.paper-notebook .diary-card-stage { color: #2b2b2b !important; }
.paper-notebook .diary-detail-content { padding-left: 26px; }

/* 书轴（卷轴） */
.paper-scroll {
  background-color: #ecdfc6;
  background-image:
    linear-gradient(90deg, rgba(140,110,60,.06) 0%, transparent 20%, transparent 80%, rgba(140,110,60,.06) 100%),
    linear-gradient(180deg, #f2e8d0 0%, #ecdfc6 50%, #dccaa8 100%);
  color: #4a3520;
  border: 1px solid #c9b48b;
  border-left: 6px double #b89c6e;
  border-right: 6px double #b89c6e;
  box-shadow:
    inset 0 0 30px rgba(120,90,50,.18),
    0 3px 8px rgba(0,0,0,.08);
}
.paper-scroll .diary-detail-title,
.paper-scroll .diary-detail-content,
.paper-scroll .diary-detail-meta,
.paper-scroll .diary-card-title,
.paper-scroll .diary-card-preview,
.paper-scroll .diary-card-date,
.paper-scroll .diary-card-stage { color: #4a3520 !important; }

/* 空白纸 */
.paper-blank {
  background-color: #ffffff;
  background-image:
    radial-gradient(circle at 50% 20%, rgba(0,0,0,.015) 0%, transparent 60%);
  color: #1d1d1f;
  border: 1px solid var(--line);
  box-shadow: 0 2px 6px rgba(0,0,0,.04);
}
.paper-blank .diary-detail-title,
.paper-blank .diary-detail-content,
.paper-blank .diary-detail-meta,
.paper-blank .diary-card-title,
.paper-blank .diary-card-preview,
.paper-blank .diary-card-date,
.paper-blank .diary-card-stage { color: #1d1d1f !important; }

/* ===== 纸张选择器 ===== */
.paper-picker {
  display: flex;
  gap: 10px;
  margin: 10px 0 4px;
  flex-wrap: wrap;
}
.paper-picker-item {
  position: relative;
  width: 56px;
  height: 56px;
  border-radius: 12px;
  border: 2px solid var(--line);
  cursor: pointer;
  overflow: hidden;
  transition: all .15s;
  padding: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}
.paper-picker-item:hover {
  transform: translateY(-2px);
  border-color: var(--muted);
}
.paper-picker-item.active {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 3px rgba(45,107,255,.2);
}

/* 每个选择器内部的「迷你纸张预览」——只画背景色/纹理，不继承纸张的文字颜色 */
.paper-picker-item .pp-preview {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* 4 种迷你预览 */
.pp-preview.pp-blank {
  background: #ffffff;
  background-image: radial-gradient(circle at 50% 20%, rgba(0,0,0,.015) 0%, transparent 60%);
}
.pp-preview.pp-kraft {
  background-color: #d9c7ae;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(120,90,50,.14) 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(120,90,50,.12) 1px, transparent 1px),
    linear-gradient(160deg, #e8d7bf 0%, #d9c7ae 50%, #cbb89c 100%);
  background-size: 10px 10px, 14px 14px, 100% 100%;
}
.pp-preview.pp-notebook {
  background-color: #fbfaf3;
  background-image:
    repeating-linear-gradient(to bottom, transparent 0, transparent 9px, #c9d6e3 9px, #c9d6e3 10px),
    linear-gradient(180deg, #fdfcf6 0%, #f6f3e6 100%);
}
.pp-preview.pp-scroll {
  background-color: #ecdfc6;
  background-image: linear-gradient(180deg, #f2e8d0 0%, #ecdfc6 50%, #dccaa8 100%);
  border-left: 4px double #b89c6e;
  border-right: 4px double #b89c6e;
}

/* 选择器上的文字标签 */
.paper-picker-label {
  position: relative;
  z-index: 2;
  font-size: 10px;
  font-weight: 600;
  color: var(--text);
  text-shadow: 0 1px 2px rgba(255,255,255,.85), 0 0 4px rgba(255,255,255,.6);
  padding: 1px 4px;
  border-radius: 6px;
  background: rgba(0,0,0,.04);
  pointer-events: none;
}
body.theme-light .paper-picker-label {
  color: #1d1d1f;
  text-shadow: none;
  background: rgba(255,255,255,.6);
}

/* active 时右上角一个小勾 */
.paper-picker-item.active::after {
  content: "✓";
  position: absolute;
  top: 2px;
  right: 4px;
  z-index: 3;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  background: var(--accent-2);
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 时间来源徽标 */
.diary-time-badge {
  display: inline-block;
  font-size: 10px; font-weight: 600;
  padding: 1px 6px; border-radius: 8px;
  margin-left: 4px;
  vertical-align: middle;
}
.diary-time-badge.world { background: rgba(45,107,255,.15); color: var(--accent-2); }
.diary-time-badge.real  { background: rgba(76,175,80,.15); color: #4caf50; }

/* ============================================================
   📖 日记文字颜色修复 · 适配黑版/白版 + 纸张背景
   ============================================================ */

/* 1. 彼得回应框（.diary-detail-response）的文字 —— 无纸张时，用主题色 */
.diary-detail-response-text {
  color: var(--text) !important;
}
.diary-detail-response-label {
  color: var(--accent-2) !important;
}

/* 2. 有纸张背景时，响应文字必须用纸张对应的深色（因为内联背景是半透明白） */
.paper-blank .diary-detail-response-text,
.paper-blank .diary-detail-response-label { color: #1d1d1f !important; }

.paper-kraft .diary-detail-response-text,
.paper-kraft .diary-detail-response-label { color: #3b2a1a !important; }

.paper-notebook .diary-detail-response-text,
.paper-notebook .diary-detail-response-label { color: #2b2b2b !important; }

.paper-scroll .diary-detail-response-text,
.paper-scroll .diary-detail-response-label { color: #4a3520 !important; }

/* 纸张下 label 用稍深的色，避免跟正文混 */
.paper-kraft .diary-detail-response-label  { color: #7a5a30 !important; }
.paper-scroll .diary-detail-response-label { color: #8a6b40 !important; }

/* 3. 卡片列表预览（.diary-card-response）的字体修复 */
.diary-card-response {
  color: var(--accent-2) !important;
  font-weight: 500;
}

/* 纸张卡片上的预览文字 —— 用深色而不是蓝色（蓝字叠纸张不好看） */
.paper-blank    .diary-card-response { color: #3a3a3f !important; font-style: italic; }
.paper-kraft    .diary-card-response { color: #5a3f28 !important; font-style: italic; }
.paper-notebook .diary-card-response { color: #3a3a3a !important; font-style: italic; }
.paper-scroll   .diary-card-response { color: #6a4a2a !important; font-style: italic; }

/* 4. 卡片列表的"有 N 条留言"小标签在纸张上也要对比度 */
.paper-kraft .diary-card [style*="var(--accent-2)"],
.paper-scroll .diary-card [style*="var(--accent-2)"] {
  color: inherit !important;
  opacity: 0.75;
}

/* 5. 留言往来气泡（彼得回复的灰色气泡）—— 修复白版对比度 */
/* 彼得气泡在 showDiary 里是 background:var(--panel-2), color:var(--text) 的内联样式，
   在白版下 panel-2=#f0f0f5 太浅，这里补一个边框和更深的文字色 */
body.theme-light .diary-detail [style*="background:var(--panel-2)"][style*="color:var(--text)"] {
  background: #eef1f5 !important;
  color: #1d1d1f !important;
  border-color: #d2d2d7 !important;
}

/* 6. 元信息（日期/阶段）在纸张卡片上也补一下 */
.paper-blank    .diary-card-meta,
.paper-kraft    .diary-card-meta,
.paper-notebook .diary-card-meta,
.paper-scroll   .diary-card-meta {
  opacity: 0.85;
}

/* ===== 平行宇宙剧场 ===== */
.th-wrap { padding: 16px; }
.th-header { margin-bottom: 20px; }
.th-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
.th-subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }

.th-active-banner {
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(135deg, rgba(45,107,255,.15), rgba(230,36,41,.1));
  border: 1px solid var(--accent-2);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 18px;
}
.th-active-label { font-size: 11px; color: var(--accent-2); font-weight: 600; margin-bottom: 4px; }
.th-active-title { font-size: 15px; font-weight: 700; color: var(--text); }
.th-active-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.th-active-btn {
  background: var(--accent-2); color: #fff; border: none;
  border-radius: 20px; padding: 8px 18px; font-weight: 600;
  font-size: 13px; cursor: pointer;
}

.th-section-title {
  font-size: 13px; font-weight: 600; color: var(--muted);
  margin: 20px 0 10px; letter-spacing: 0.5px;
}

.th-universe-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.th-universe-card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  cursor: pointer;
  overflow: hidden;
  transition: all .2s;
}
.th-universe-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--u-color);
}
.th-universe-card:hover {
  border-color: var(--u-color);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}
.th-universe-tag {
  display: inline-block;
  font-size: 10px; font-weight: 600;
  color: var(--u-color);
  background: color-mix(in srgb, var(--u-color) 15%, transparent);
  padding: 2px 8px; border-radius: 8px;
  margin-bottom: 8px;
}
.th-universe-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.th-universe-year { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.th-universe-desc {
  font-size: 11px; color: var(--muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.th-universe-arrow {
  position: absolute; bottom: 10px; right: 12px;
  color: var(--u-color); font-size: 16px; opacity: 0;
  transition: all .2s;
}
.th-universe-card:hover .th-universe-arrow { opacity: 1; transform: translateX(2px); }

.th-custom-btn {
  width: 100%;
  background: var(--panel);
  border: 1px dashed var(--line);
  border-radius: 14px;
  padding: 16px;
  display: flex; align-items: center; justify-content: center; gap: 8px;

.th-history-list { display: flex; flex-direction: column; gap: 8px; }

.th-empty { text-align: center; padding: 24px; color: var(--muted); font-size: 12px; }

/* 表单 */

.th-form-label:first-child { margin-top: 0; }
.th-form-input, .th-form-textarea {

.th-form-textarea { resize: vertical; line-height: 1.5; }
.th-form-input:focus, .th-form-textarea:focus { border-color: var(--accent-2); }
.th-form-actions { display: flex; gap: 8px; margin-top: 18px; }

.th-btn {

}
.th-btn.primary { background: var(--accent-2); color: #fff; flex: 1; }

.th-btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); flex: 1; }
.th-btn.ghost:hover { border-color: var(--accent-2); color: var(--accent-2); }
.th-btn.small { padding: 8px 14px; font-size: 12px; }

/* 剧情页 */
.th-quest-header { margin-bottom: 16px; }
.th-quest-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.th-quest-universe {
  display: inline-block;
  font-size: 11px; font-weight: 600;
  color: var(--u-color);
  background: color-mix(in srgb, var(--u-color) 15%, transparent);
  padding: 3px 10px; border-radius: 8px;
  margin-bottom: 8px;
}
.th-quest-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.th-quest-meta .dot { margin: 0 6px; opacity: 0.5; }
.th-quest-bg { font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.5; }

.th-quest-actions { display: flex; gap: 8px; margin-bottom: 16px; }
.th-quest-actions .th-btn { flex: 1; }

.th-quest-story {
  font-size: 14px; line-height: 1.8; color: var(--text);
  white-space: pre-wrap; margin-bottom: 20px;

}

.th-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.th-option-btn {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px;
  color: var(--text); font-size: 13px; line-height: 1.5;
  text-align: left; cursor: pointer; transition: all .15s;
  white-space: normal; word-break: break-word;
}
.th-option-btn:hover { border-color: var(--accent-2); background: rgba(45,107,255,.05); }

.th-custom-action { display: flex; gap: 8px; }
.th-custom-action .th-form-input { flex: 1; }
.th-custom-action .th-btn { flex: none; }

.th-quest-closed {
  text-align: center; padding: 24px;
  background: var(--panel); border-radius: 14px;
  border: 1px dashed var(--line);
}
.th-quest-closed-text { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

.th-error { padding: 20px; text-align: center; color: var(--accent); font-size: 13px; }
/* 正在输入动画 */
.typing-indicator .dot {
  width: 4px; height: 4px; background: var(--muted); border-radius: 50%;
  animation: typing 1.4s infinite ease-in-out both;
}
.typing-indicator .dot:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator .dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes typing {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* 心声动画 */
@keyframes fadeInOut {
  0% { opacity: 0; transform: translateY(-10px); }
  10% { opacity: 1; transform: translateY(0); }
  90% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-10px); }
}
/* 翻译气泡 */
.bubble-trans {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed rgba(255, 255, 255, 0.2);
  font-family: "SimSun", "宋体", serif; /* 用宋体区隔 */
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}
body.theme-light .bubble-trans {
  border-top: 1px dashed rgba(0, 0, 0, 0.15);
}
/* ===== 修复世界线文字和输入框 ===== */
.story-content {
  color: var(--text) !important; /* 强制使用正文颜色，白版黑字，黑版白字 */
}
.btn.ghost {
  color: var(--text) !important; /* 确保选项按钮文字清晰 */
  background: var(--panel-2);
}
#customAct {
  box-sizing: border-box !important; /* 防止输入框超出边界 */
  width: 100% !important;
  color: var(--text) !important;
  background: var(--panel-2) !important;
  border: 1px solid var(--line) !important;
}
/* ============================================================
   ✨ 帮我起话题 · 弹窗样式
   ============================================================ */
.topic-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.2s ease;
  overflow-y: auto;
}
.topic-modal-overlay.show {
  opacity: 1;
}

.topic-modal-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  transform: translateY(20px) scale(0.96);
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  overflow: hidden;
}
.topic-modal-overlay.show .topic-modal-panel {
  transform: translateY(0) scale(1);
}

/* 顶部 */
.topic-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg, rgba(45, 107, 255, 0.08), rgba(230, 36, 41, 0.06));
}
.topic-modal-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.topic-modal-emoji {
  font-size: 18px;
  filter: drop-shadow(0 0 6px rgba(45, 107, 255, 0.5));
}
.topic-modal-close {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--muted);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.topic-modal-close:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* 副标题 */
.topic-modal-sub {
  padding: 12px 18px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  border-bottom: 1px solid var(--line);
}
.topic-modal-sub b {
  color: var(--accent-2);
  font-weight: 600;
}

/* 主体 */
.topic-modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 200px;
}

/* 加载中 */
.topic-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 40px 10px;
}
.topic-loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--line);
  border-top-color: var(--accent-2);
  border-radius: 50%;
  animation: topicSpin 0.9s linear infinite;
}
@keyframes topicSpin {
  to { transform: rotate(360deg); }
}
.topic-loading-text {
  font-size: 13px;
  color: var(--muted);
}

/* 话题卡片 */
.topic-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.topic-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(to bottom, var(--accent-2), var(--accent));
  opacity: 0;
  transition: opacity 0.18s;
}
.topic-card:hover {
  border-color: var(--accent-2);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(45, 107, 255, 0.15);
}
.topic-card:hover::before {
  opacity: 1;
}

.topic-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.topic-card-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.topic-card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.topic-card-bg {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 10px;
  padding-left: 10px;
  border-left: 2px solid var(--line);
}
.topic-card-bg-label {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  color: var(--accent-2);
  background: rgba(45, 107, 255, 0.12);
  padding: 1px 6px;
  border-radius: 6px;
  margin-right: 6px;
  vertical-align: middle;
}

.topic-card-opener {
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.65;
  background: var(--bg);
  padding: 10px 12px;
  border-radius: 10px;
  font-style: italic;
  position: relative;
  word-break: break-word;
}
.topic-card-opener-quote {
  color: var(--accent-2);
  font-weight: 700;
  font-style: normal;
}

.topic-card-use {
  margin-top: 10px;
  text-align: right;
  font-size: 11px;
  color: var(--accent-2);
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.18s;
}
.topic-card:hover .topic-card-use {
  opacity: 1;
}

/* 错误 */
.topic-error {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 30px 16px;
  text-align: center;
}
.topic-error-emoji {
  font-size: 36px;
}
.topic-error-text {
  font-size: 13px;
  color: var(--accent);
  line-height: 1.5;
}
.topic-retry-btn {
  background: var(--accent-2);
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 8px 24px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 4px;
}

/* 底部 */
.topic-modal-footer {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  background: var(--panel-2);
}
.topic-modal-regen,
.topic-modal-cancel {
  flex: 1;
  padding: 11px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid var(--line);
}
.topic-modal-regen {
  background: var(--panel);
  color: var(--accent-2);
}
.topic-modal-regen:hover:not(:disabled) {
  background: rgba(45, 107, 255, 0.1);
  border-color: var(--accent-2);
}
.topic-modal-regen:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.topic-modal-cancel {
  background: var(--panel);
  color: var(--muted);
}
.topic-modal-cancel:hover {
  color: var(--text);
  border-color: var(--muted);
}

  letter-spacing: 0.5px;
}
.mjn-clue-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent);
  opacity: 0.3;
}

/* 冷却提示 */
.mjn-cooldown {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 12px;
  font-style: italic;
  font-family: "FangSong", "仿宋", serif;
}

.mjn-gen-more {
  font-family: inherit;
}

/* ===== 观察名单 ===== */
.mjn-suspect-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.mjn-suspect-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  transition: all 0.15s;
}
.mjn-suspect-card:hover {
  border-color: var(--accent-2);
}
.mjn-suspect-self {
  border-style: dashed;
  opacity: 0.85;
}
.mjn-suspect-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: #fff;
  font-weight: 800;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
.mjn-suspect-info {
  flex: 1;
  min-width: 0;
}
.mjn-suspect-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.mjn-suspect-desc {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
}
.mjn-suspect-notes {
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
  padding-left: 8px;
  border-left: 2px solid var(--accent);
  opacity: 0.85;
}
.mjn-suspect-notes b {
  color: var(--accent);
  font-weight: 700;
}

/* ===== 拼图页 ===== */
.mjn-profile {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.mjn-profile-section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.mjn-profile-section::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
  opacity: 0.6;
}
.mjn-profile-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}
.mjn-profile-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mjn-stat {
  text-align: center;
  padding: 12px 6px;
  background: var(--panel-2);
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}
.mjn-stat::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
  opacity: 0.6;
}
.mjn-stat-num {
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.mjn-stat-label {
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.5px;
}
.mjn-puzzle {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 0;
}
.mjn-puzzle-piece {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: var(--panel-2);
  border: 1px dashed var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.15s;
  cursor: help;
}
.mjn-puzzle-piece:hover {
  border-color: var(--accent);
  border-style: solid;
  transform: scale(1.1) rotate(-3deg);
  box-shadow: 0 4px 12px rgba(230, 36, 41, 0.2);
}
.mjn-puzzle-empty {
  font-size: 12px;
  color: var(--muted);
  padding: 20px;
  width: 100%;
  text-align: center;
  font-style: italic;
}
.mjn-puzzle-hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  font-style: italic;
}
.mjn-profile-quote {
  background: linear-gradient(135deg, rgba(45, 107, 255, 0.06), rgba(230, 36, 41, 0.04));
  border-left: 3px solid var(--accent-2);
  padding: 18px 20px;
}
.mjn-quote-mark {
  font-size: 32px;
  color: var(--accent-2);
  opacity: 0.4;
  font-family: Georgia, serif;
  line-height: 0.5;
}
.mjn-quote-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.8;
  font-family: "FangSong", "仿宋", serif;
  font-style: italic;
  margin: 8px 0;
  padding: 0 8px;
}

/* ===== 未解锁状态 ===== */
.mjn-locked {
  text-align: center;
  padding: 60px 20px;
  background: var(--panel);
  border-radius: 16px;
  border: 1px dashed var(--line);
}
.mjn-locked-icon {
  font-size: 56px;
  margin-bottom: 16px;
  opacity: 0.6;
  filter: drop-shadow(0 0 12px rgba(230, 36, 41, 0.3));
}
.mjn-locked-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  font-family: "FangSong", "仿宋", serif;
  letter-spacing: 1px;
}
.mjn-locked-desc {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 24px;
  font-family: "FangSong", "仿宋", serif;
}
.mjn-locked-progress {
  max-width: 260px;
  margin: 0 auto;
}
.mjn-progress-bar {
  height: 6px;
  background: var(--panel-2);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.mjn-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  border-radius: 3px;
  transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.mjn-progress-text {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.5px;
}

/* ===== 响应式 ===== */
@media (max-width: 380px) {
  .mjn-cover {
    padding: 14px 16px;
  }
  .mjn-cover-title {
    font-size: 18px;
    letter-spacing: 2px;
  }
  .mjn-suspicion-ring {
    width: 64px;
    height: 64px;
  }
  .mjn-suspicion-num {
    font-size: 15px;
  }
  .mjn-showdown-btn {
    padding: 6px 12px;
    font-size: 11px;
  }
}

          db.createObjectStore("images", { keyPath: "id" });

    });

    if (!this.db) await this.init();
    return new Promise((resolve, reject) => {
      try {
        const tx = this.db.transaction("tracks", "readwrite");
        const req = tx.objectStore("tracks").put(track);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
        tx.onabort = (e) => reject(new Error("事务被中止"));
      } catch (e) { reject(e); }
    });

const audioConverter = {
  // 选择当前浏览器支持的最佳输出格式
  pickMime() {
    const candidates = [
      "audio/mpeg",           // 真 MP3（Chrome 113+）
      "audio/webm;codecs=opus", // WebM Opus（绝大多数现代浏览器）
      "audio/webm",
      "audio/ogg;codecs=opus",
      "audio/ogg"
    ];
    if (typeof MediaRecorder === "undefined") return null;
    for (const m of candidates) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return null;
  },

  // 判断是否是需要转换的格式（浏览器能否直接播）
  needConvert(file) {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    // 只对 flac / wav（体积太大） / ogg 做转换，mp3/m4a 已经最好，直接存
    if (ext === "flac") return true;
    if (ext === "wav") return true;
    if (ext === "ogg" && !file.type.includes("opus")) return true;
    return false;
  },

  // 用 WebAudio 解码 + MediaRecorder 重编码
  // 返回 Promise<{blob, mime, ext}>
  async convert(file, onProgress) {
    const targetMime = this.pickMime();
    if (!targetMime) {
      throw new Error("当前浏览器不支持 MediaRecorder，无法转换");
    }

    // 1. 解码
    onProgress && onProgress("解码中...");
    const arrayBuffer = await file.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) throw new Error("当前浏览器不支持 WebAudio，无法转换");

    const ctx = new AudioCtx();
    let audioBuffer;
    try {
      audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
    } catch (e) {
      await ctx.close();
      throw new Error("当前浏览器无法解码该音频（如 iOS Safari 不支持 FLAC），请换 MP3/M4A 文件");
    }

    // 2. 编码：用一个 MediaStreamDestination 把 AudioBuffer 喂给 MediaRecorder
    onProgress && onProgress("编码中...");
    const duration = audioBuffer.duration;
    const sampleRate = audioBuffer.sampleRate;
    const channels = Math.min(audioBuffer.numberOfChannels, 2);
    const frameCount = audioBuffer.length;

    // 手动分块播放 + 录制，避免 WebAudio 一次全局播放
    const dest = ctx.createMediaStreamDestination();
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(dest);
    // 不能连到 ctx.destination，否则会边转码边外放
    // 但某些浏览器要求必须 link 到 destination 才能"跑"，我们连一个静音 gain
    const silentGain = ctx.createGain();
    silentGain.gain.value = 0;
    source.connect(silentGain);
    silentGain.connect(ctx.destination);

    const recorder = new MediaRecorder(dest.stream, { mimeType: targetMime });
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

    const donePromise = new Promise((resolve, reject) => {
      recorder.onstop = () => {
        try {
          const blob = new Blob(chunks, { type: targetMime });
          const ext = targetMime.includes("mpeg") ? "mp3"
                    : targetMime.includes("webm") ? "webm"
                    : targetMime.includes("ogg") ? "ogg"
                    : "bin";
          resolve({ blob, mime: targetMime, ext });
        } catch (e) { reject(e); }
      };
      recorder.onerror = (e) => reject(e.error || new Error("MediaRecorder 编码失败"));
    });

    recorder.start();
    source.start(0);

    // 等待播放结束（比 audioBuffer.duration 略长一点保险）
    await new Promise((resolve) => {
      source.onended = resolve;
      // 保险：如果 onended 没触发，duration + 1 秒后强制停
      setTimeout(resolve, (duration + 1) * 1000);
    });
    // 给 recorder 一点时间冲最后一块数据
    await new Promise(r => setTimeout(r, 300));
    recorder.stop();
    const result = await donePromise;

    await ctx.close();
    return result;
  }
};

    // 恢复上次播放位置（可选）
    const saved = JSON.parse(localStorage.getItem("sv_music_state") || "null");
    if (saved) this.currentId = saved.id;
  },

  async loadTracks() {
    this.tracks = await dbHelper.getAll();
    return this.tracks;
  },

   play(id) {
    const t = this.tracks.find(x => x.id === id);
    if (!t) return;
    if (this._lastUrl) URL.revokeObjectURL(this._lastUrl);

    let blob;
    try {
      blob = t.type ? new Blob([t.data], { type: t.type }) : new Blob([t.data]);
    } catch (e) {
      return toast("数据异常：" + e.message);
    }

    const url = URL.createObjectURL(blob);
    this._lastUrl = url;

    // ⚠️ 关键修复：不要 removeAttribute + load()，
    // 直接设置 src 即可。removeAttribute + load() 会触发一次异步 onerror
    // 导致误报"无法播放"。
    this.audio.onerror = null;   // 先解绑旧回调
    this.audio.pause();
    this.audio.src = url;
    this.audio.load();

    // 重新绑定错误处理（只处理本次播放的真实错误）
    const handleError = () => {
      const err = this.audio.error;
      let msg = "无法播放（浏览器可能不支持该音频编码）";
      if (err) {
        if (err.code === 1) msg = "播放被中止";
        if (err.code === 2) msg = "网络/解码错误";
        if (err.code === 3) msg = "解码失败";
        if (err.code === 4) msg = "格式不支持：浏览器无法解码该音频";
      }
      toast(msg);
    };
    this.audio.addEventListener("error", handleError, { once: true });

    this.audio.play().catch(e => {
      toast("播放失败：" + (e.message || e.name));
    });

    this.currentId = id;
    localStorage.setItem("sv_music_state", JSON.stringify({ id }));
    this._notifyUI();
  },

  pause() { this.audio.pause(); this._notifyUI(); },

  stop() {
    this.audio.pause();
    this.audio.currentTime = 0;
    this._notifyUI();
  },

  toggle(id) {
    if (this.currentId === id && !this.audio.paused) {
      this.pause();
    } else {
      this.play(id);
    }
  },

  _notifyUI() {
    // 如果当前在音乐 App，刷新 UI
    if (currentApp === "music" && window._musicRefreshUI) {
      window._musicRefreshUI();
    }
  }
};

if (res.status >= 500) {

}

throw new Error("API 报错: " + res.status + detail);
}
    const data = await res.json();

// ============================================================
// 🖼️ 生图：支持纯文生图 + 参考图图生图
//   - 有参考图 → 走 /images/edits（图生图，AI 严格按参考图）
//   - 无参考图 → 走 /images/generations（纯文生图）
// ============================================================
async function generateImage(prompt, refs) {
  const cfg = store.getConfig();
  const key = cfg.imgApiKey || cfg.apiKey;
  const baseUrl = (cfg.imgBaseUrl || "https://api.openai.com/v1").replace(/\/+$/, "");
  const model = cfg.imgModel || "dall-e-3";

  // 规范化 refs：可以是单个 dataURL 字符串，也可以是 dataURL 数组
  let refList = [];
  if (typeof refs === "string" && refs.startsWith("data:")) refList = [refs];
  else if (Array.isArray(refs)) refList = refs.filter(x => typeof x === "string" && x.startsWith("data:"));

  // ===== 无参考图 → 纯文生图 =====
  if (refList.length === 0) {
    const url = baseUrl + "/images/generations";
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model, prompt, n: 1, size: "1024x1024" })
    });
    if (!res.ok) throw new Error("生图失败: " + res.status);
    const data = await res.json();
    const item = data.data[0];
    if (item.url) return item.url;
    if (item.b64_json) {
      const bin = atob(item.b64_json);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
    }
    throw new Error("AI 返回的图片格式无法解析");
  }

// ★ 如果 refs 是 idb:key，先解析成 dataURL
  refList = await Promise.all(refList.map(async (v) => {
    if (v.startsWith("idb:")) {
      const data = await dbHelper.getImage(v.slice(4));
      return data || "";
    }
    return v;
  }));
  refList = refList.filter(x => x && x.startsWith("data:"));

  // ===== 有参考图 → 图生图 =====
   // ★ 参考图模式：仅对"确定不支持 edits 接口"的模型做降级；
  //   其余（gpt-image-1/2、dall-e-2、flux 系列、中转站的魔改模型等）一律按用户选的模型走
  const knownNoEditModels = ["dall-e-3", "dall-e"];
  const editModel = knownNoEditModels.includes(model.toLowerCase())
    ? "gpt-image-2"
    : model;

  // 把 dataURL 转成 Blob
  const dataUrlToBlob = (dataUrl) => {
    const arr = dataUrl.split(",");
    const mime = (arr[0].match(/:(.*?);/) || [])[1] || "image/png";
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    return new Blob([u8], { type: mime });
  };

  // ★ 参考图是权威来源：强制 AI 按参考图的脸/造型生成，文字只作补充
  const strictPrompt = `Use the provided reference image as the strict visual anchor for the character's face, hairstyle, body type, and outfit. Keep the character visually identical to the reference. ${prompt}`;

  const form = new FormData();
  form.append("model", editModel);
  form.append("prompt", strictPrompt);
  form.append("n", "1");
  form.append("size", "1024x1024");
  // OpenAI edits 接口：参考图最多 1 张（dall-e-2 只支持 1 张，gpt-image-1 可多张但这里只传 1 张最稳）
  const firstRefBlob = dataUrlToBlob(refList[0]);
  form.append("image", firstRefBlob, "reference.png");

  const url = baseUrl + "/images/edits";
  const res = await fetch(url, {
    method: "POST",
    headers: { "Authorization": "Bearer " + key },
    body: form
  });

  if (!res.ok) {
    let detail = "";
    try { detail = await res.text(); } catch (_) {}
    throw new Error("参考图生图失败: " + res.status + " | " + detail.slice(0, 300));
  }

  const data = await res.json();
  const item = data.data[0];
  if (item.url) return item.url;
  if (item.b64_json) {
    const bin = atob(item.b64_json);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
  }
  throw new Error("AI 返回的图片格式无法解析");
}

// ===== 时间推进工具 =====
function addDays(year, month, day, add) {
  const d = new Date(year, month - 1, day);
  d.setDate(d.getDate() + add);
  return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
}

// ===== 时间推进（只按 AI 显式指令推进，不再自动跳） =====
function advanceTimeByDays(s, days) {
  if (!days || days === 0) return false;
  const next = addDays(s.gameYear, s.gameMonth, s.gameDay, days);
  s.gameYear = next.year;
  s.gameMonth = next.month;
  s.gameDay = next.day;

  // 检查阶段推进
  const phase = WORLD.timeline[s.anchor];
  const [m1, m2] = phase.monthRange;
  const pastPhase =
    s.gameYear > phase.year ||
    (s.gameYear === phase.year && s.gameMonth > m2);

  if (pastPhase && s.anchor < WORLD.timeline.length - 1) {
    s.anchor += 1;
    const np = WORLD.timeline[s.anchor];
    // 阶段推进时，日期对齐到新阶段开始
    if (s.gameYear < np.year || (s.gameYear === np.year && s.gameMonth < np.monthRange[0])) {
      s.gameYear = np.year;
      s.gameMonth = np.monthRange[0];
      s.gameDay = 1;
    }
    return true;
  }
  return false;
}

// 解析 AI 返回的【时间推进: +N天】指令
function parseTimeAdvance(res) {
  const m = res.match(/【时间推进[:：]\s*([+-]?\d+)\s*天?】/);
  if (!m) return 0;
  return parseInt(m[1]) || 0;
}

// ===== 删除单条消息（安全版：用最新数据 + 索引校验 + try/catch）=====
window.deleteMessage = function(userName, idx) {
  try {
    if (!userName) { toast("聊天对象无效"); return; }

    // 每次都从 localStorage 取最新，绝不使用渲染时的旧引用
    const chats = store.getChats();
    const arr = chats[userName];
    if (!Array.isArray(arr)) { toast("聊天记录不存在"); return; }

    const i = parseInt(idx);
    if (!Number.isInteger(i) || i < 0 || i >= arr.length) {
      toast("消息已不存在，正在刷新");
      apps.messages.render(document.getElementById("appBody"));
      return;
    }

    arr.splice(i, 1);
    chats[userName] = arr;
    store.setChats(chats);

    // 重新渲染当前聊天
    apps.messages.render(document.getElementById("appBody"));
  } catch (err) {
    console.error("deleteMessage 失败:", err);
    toast("删除失败：" + (err.message || "未知错误"));
    // 兜底：强制重渲染，恢复到与数据一致的状态
    try { apps.messages.render(document.getElementById("appBody")); } catch (_) {}
  }
};

// ============================================================
// 🖼️ 通用图片压缩 / 裁剪工具
//   - 头像：正方形居中裁剪 + 缩小到 256×256
//   - 参考图：长边缩到 1024，不裁剪
//   - 壁纸：长边缩到 1600，不裁剪
//   - 输出统一 JPEG，质量 0.82~0.88
// ============================================================
function compressImage(file, options) {
  const {
    maxSize = 1024,        // 长边最大像素
    square = false,        // 是否裁剪成正方形
    quality = 0.85,        // JPEG 质量
    maxBytes = 800 * 1024  // 目标体积上限（字节）
  } = options || {};

  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error("没有文件"));

    const reader = new FileReader();
    reader.onerror = () => reject(new Error("读取文件失败"));
    reader.onload = (ev) => {
      const img = new Image();
      img.onerror = () => reject(new Error("图片无法解码（可能是 HEIC 或损坏文件）"));
      img.onload = () => {
        // ---- 1. 计算目标尺寸 ----
        let srcW = img.naturalWidth;
        let srcH = img.naturalHeight;
        let dstW, dstH;

        if (square) {
          // 正方形：取短边做裁剪，输出 maxSize × maxSize
          const side = Math.min(srcW, srcH);
          const sx = (srcW - side) / 2;
          const sy = (srcH - side) / 2;
          dstW = dstH = maxSize;

          const canvas = document.createElement("canvas");
          canvas.width = dstW;
          canvas.height = dstH;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, sx, sy, side, side, 0, 0, dstW, dstH);
          return finish(canvas, quality, maxBytes, resolve, reject);
        } else {
          // 非正方形：长边缩到 maxSize
          const scale = Math.min(1, maxSize / Math.max(srcW, srcH));
          dstW = Math.round(srcW * scale);
          dstH = Math.round(srcH * scale);

          const canvas = document.createElement("canvas");
          canvas.width = dstW;
          canvas.height = dstH;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, dstW, dstH);
          return finish(canvas, quality, maxBytes, resolve, reject);
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 内部：从 canvas 逐步降质，直到 ≤ maxBytes
function finish(canvas, quality, maxBytes, resolve, reject) {
  let q = quality;
  let dataUrl = canvas.toDataURL("image/jpeg", q);
  // 体积兜底：如果超过 maxBytes，每次降 0.08 质量，最低 0.5
  let tries = 0;
  while (dataUrl.length * 0.75 > maxBytes && q > 0.5 && tries < 8) {
    q -= 0.08;
    dataUrl = canvas.toDataURL("image/jpeg", q);
    tries++;
  }
  resolve(dataUrl);
}

// ============================================================
// 🖼️ 图片 URL 解析器
//   - 普通 dataURL → 原样返回
//   - "idb:xxx" → 从 IndexedDB 读 dataURL
// ============================================================
async function resolveImageUrl(val) {
  if (!val) return "";
  if (val.startsWith("idb:")) {
    const key = val.slice(4);
    const data = await dbHelper.getImage(key);
    return data || "";
  }
  return val;
}

// 同步版本：用于渲染前已经预加载过的场景（可以用 cache）
const _imgCache = {};
async function resolveImageUrlCached(val) {
  if (!val) return "";
  if (!val.startsWith("idb:")) return val;
  const key = val.slice(4);
  if (_imgCache[key]) return _imgCache[key];
  const data = await dbHelper.getImage(key);
  if (data) _imgCache[key] = data;
  return data || "";
}

// 🖼️ 文件选择通用工具：显式触发 + 每次清空（解决 iOS / WebView 点不动）
// ============================================================
function bindFileTrigger(triggerSelector, inputSelector, scope) {
  const root = scope || document;
  const trigger = root.querySelector(triggerSelector);
  const input = root.querySelector(inputSelector);
  if (!trigger || !input) return;

  trigger.addEventListener("click", (e) => {

          const disabledItem = document.createElement("div");
          disabledItem.style.cssText = "padding:14px 18px;color:#666;font-size:14px;";
          disabledItem.textContent = "🔄 重新生成图片（无原始提示词）";
          menu.appendChild(disabledItem);
        }

        // 保存图片
        const saveItem = document.createElement("div");
        saveItem.style.cssText = "padding:14px 18px;cursor:pointer;color:#fff;font-size:14px;border-radius:10px;transition:background .15s;";
        saveItem.textContent = "💾 保存图片";
        saveItem.onmouseenter = () => saveItem.style.background = "rgba(45,107,255,0.15)";
        saveItem.onmouseleave = () => saveItem.style.background = "transparent";
        saveItem.onclick = async () => {
          closeMenu();
          try {
            // 用 fetch 拿到 blob 再下载，避免跨域直接 a[download] 失效
            const resp = await fetch(post.img, { mode: "cors" });
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            // 文件名：name_text前10字.png
            const safeName = String(post.name || "image").replace(/[\\/:*?"<>|]/g, "_");
            a.download = `${safeName}_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 3000);
            toast("图片已保存");
          } catch (err) {
            // 兜底：如果 fetch 跨域失败，直接打开原图让用户手动长按保存
            window.open(post.img, "_blank");
            toast("已在新标签打开，请手动长按保存");
          }
        };
        menu.appendChild(saveItem);

        // 取消
        const cancelItem = document.createElement("div");
        cancelItem.style.cssText = "padding:12px 18px;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid #333;margin-top:4px;";
        cancelItem.textContent = "取消";
        cancelItem.onclick = () => closeMenu();
        menu.appendChild(cancelItem);

        // ==== 遮罩 ====
        const mask = document.createElement("div");
        mask.className = "__global_menu_mask";
        mask.style.cssText = "position:fixed;inset:0;z-index:998;background:rgba(0,0,0,0.55);";
        document.body.appendChild(mask);
        document.body.appendChild(menu);

        let closed = false;
        const closeMenu = () => {
          if (closed) return;
          closed = true;
          menu.remove();
          mask.remove();
          document.removeEventListener("touchstart", onTouchStart);
        };
        const onTouchStart = (e) => {
          if (menu.contains(e.target)) return;
          closeMenu();
        };
        mask.onclick = closeMenu;
        // 延迟绑定全局 touchstart，避免刚打开的点击事件立刻关闭菜单
        setTimeout(() => {
          if (closed) return;
          document.addEventListener("touchstart", onTouchStart, { passive: true });
        }, 350);
      };
    });
  }
},

        <div id="mvListB" style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;"></div>

        <div style="display:flex;gap:8px;">
          <button class="btn ghost" id="mvCancel" style="flex:1;">取消</button>
          <button class="btn" id="mvGo" style="flex:1;opacity:0.4;pointer-events:none;">🚀 撞在一起</button>
        </div>
        <div id="mvHint" style="font-size:11px;color:var(--muted);margin-top:12px;text-align:center;">
          请选择两个不同的宇宙
        </div>
      </div>
    `;
    document.querySelector(".device").appendChild(div);

    let pickA = null;
    let pickB = null;

    const renderList = (container, which) => {
      container.innerHTML = universes.map(u => `
        <div class="mv-item" data-key="${u.key}" data-which="${which}" style="padding:10px 12px;background:var(--panel);border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;">
          <div style="width:8px;height:32px;background:${u.color};border-radius:3px;flex-shrink:0;"></div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:700;color:var(--text);">${esc(u.title)}</div>
            <div style="font-size:11px;color:var(--muted);">${esc(u.year)} · ${esc(u.tag)}</div>
          </div>
        </div>
      `).join("") || `<div style="font-size:12px;color:var(--muted);padding:10px;">还没有已完结的宇宙</div>`;
    };

    const listA = div.querySelector("#mvListA");
    const listB = div.querySelector("#mvListB");
    renderList(listA, "A");
    renderList(listB, "B");

    const updateGoBtn = () => {
      const goBtn = div.querySelector("#mvGo");
      const hint = div.querySelector("#mvHint");
      if (pickA && pickB && pickA !== pickB) {
        goBtn.style.opacity = "1";
        goBtn.style.pointerEvents = "auto";
        const ua = universes.find(u => u.key === pickA);
        const ub = universes.find(u => u.key === pickB);
        hint.textContent = `${ua.title} × ${ub.title}`;
      } else {
        goBtn.style.opacity = "0.4";
        goBtn.style.pointerEvents = "none";
        hint.textContent = pickA === pickB && pickA ? "不能选同一个宇宙" : "请选择两个不同的宇宙";
      }
    };

    div.querySelectorAll(".mv-item").forEach(el => {
      el.onclick = () => {
        const which = el.dataset.which;
        const key = el.dataset.key;
        if (which === "A") pickA = key;
        else pickB = key;

        // 高亮当前选择的列表
        const thisList = which === "A" ? listA : listB;
        thisList.querySelectorAll(".mv-item").forEach(x => {
          x.style.borderColor = x.dataset.key === key ? "var(--accent-2)" : "var(--line)";
          x.style.background = x.dataset.key === key ? "rgba(45,107,255,.08)" : "var(--panel)";
        });
        updateGoBtn();
      };
    });

    div.querySelector("#mvCancel").onclick = () => div.remove();
    div.querySelector("#mvGo").onclick = () => {
      const ua = universes.find(u => u.key === pickA);
      const ub = universes.find(u => u.key === pickB);
      if (!ua || !ub) return;
      div.remove();
      this.startMultiverse(body, ua, ub);
    };
  },

  // ============================================================
  // 🌌 多元宇宙穿越 · 生成开场
  // ============================================================
  async startMultiverse(body, uA, uB) {
    body.innerHTML = `<div class="loader"><div class="spin"></div>正在撕裂多元宇宙...</div>`;

    try {
      const sNow = store.getState();
      const date = `${sNow.gameYear}年${sNow.gameMonth}月${sNow.gameDay}日`;
      const profile = store.getProfile();
      const playerName = profile.name || "玩家";
      const playerPronoun = profile.gender === "male" ? "他" : "她";

      const sysPrompt = `你是一个剧情 DM，正在生成一段**跨宇宙相遇**的开场。

【宇宙 A】${uA.title}（${uA.year}）
背景：${uA.background}
规则：${uA.rules}

【宇宙 B】${uB.title}（${uB.year}）
背景：${uB.background}
规则：${uB.rules}

【玩家】${playerName}（${profile.gender === "male" ? "男" : "女"}，用「${playerPronoun}」指代）

【当前游戏内日期】${date}

【核心设定 · 铁律 · 违反即失败】
1. **两个宇宙的彼得因某种"维度裂缝"撞在了一起**。可以是：
   - 彼得 A 追某个反派时被拉进了彼得 B 的世界
   - 彼得 B 在荡蛛丝时突然掉进了彼得 A 的纽约
   - 两人同时被一个"跨维度事件"卷进一个中间地带（比如某个废弃地铁站、某个神秘实验室）
   - 玩家的存在是第三个变量（玩家可能同时认识两个彼得，也可能被卷进来）
2. **两个彼得一开始都不知道对方是谁**。他们会互相试探、误解、甚至打起来。
3. **两个宇宙的规则必须互相冲突**：
   - 托比宇宙的彼得：有机蛛丝、报纸时代、没有复联
   - 加菲宇宙的彼得：机械发射器、格温、没有复联
   - 黑色战衣宇宙的彼得：共生体、暴躁、力量更强
   - 蜘蛛格温宇宙：格温是蜘蛛侠、彼得是普通人
   - 2099 宇宙：赛博朋克、企业统治
   - 暗影宇宙：黑白世界、大萧条
   - 自定义宇宙：按用户设定

【开场要求】
1. 写一段 800-1200 字的开场剧情。
2. 剧情必须包含：
   - 撞在一起的那一瞬间（感官描写）
   - 两个彼得第一次对视、第一句话
   - 一个具体的危机/谜题（让玩家必须做选择）
3. 结尾用【选项】列出 A. B. C. D. 四个方向。
4. 最后一行：【小剧场标题: 不超过8个字】

【文风】电影镜头感，两个彼得性格差异要鲜明。对白用 *"English"*（中文翻译）格式。

【穿越逻辑 · 极重要】
本剧场是一个**独立小剧场**，与 MCU 主线无关。两个彼得最终要么：
- 其中一个选择"留下"，另一个"回去"
- 两个都回去，但留下某样东西
- 两个宇宙合并（代价巨大）
- 玩家作为锚点，让两个宇宙"共存"（需要付出代价）

**本剧场不会超过 20 回合**。到第 15 回合左右，剧情会自动推进到"必须做出最终选择"。

现在写开场。`;

      const res = await callAI([{ role: "user", content: "开始跨宇宙相遇" }], sysPrompt);

      const titleMatch = res.match(/【小剧场标题[:：]\s*(.+?)】/);
      const optionsIdx = res.indexOf("【选项】");
      const storyText = (optionsIdx > -1 ? res.slice(0, optionsIdx) : res)
        .replace("【剧情】", "")
        .replace(/【小剧场标题[:：].*?】/g, "")
        .trim();
      const optionsText = optionsIdx > -1 ? res.slice(optionsIdx + 4).trim() : "";
      const title = titleMatch ? titleMatch[1].trim() : "跨宇宙相遇";

      const q = {
        id: "th_mv_" + Date.now() + "_" + Math.random().toString(36).slice(2),
        title: `${uA.title} × ${uB.title} · ${title}`,
        background: `跨宇宙相遇：${uA.title}（${uA.year}）× ${uB.title}（${uB.year}）`,
        universe: "multiverse",
        universeA: uA.key,
        universeB: uB.key,
        identity: "跨宇宙见证者",
        tone: "多元宇宙",
        pov: sNow.pov || "second",
        userName: playerName,
        date,
        story: storyText,
        options: optionsText,
        history: [],
        closed: false,
        createdAt: Date.now(),
        openingStory: storyText,
        openingOptions: optionsText,
        maxTurns: 20
      };

      const all = JSON.parse(localStorage.getItem("sv_theaters") || "[]");
      all.unshift(q);
      localStorage.setItem("sv_theaters", JSON.stringify(all));

      this.bindChat(q);
      toast("宇宙撕裂完成：" + title);
      this.openQuest(q.id);
    } catch (e) {
      body.innerHTML = `<div class="th-wrap"><div class="th-error">生成失败：${esc(e.message)}</div></div>`;
    }
  },
