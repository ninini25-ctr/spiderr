  bindChat(q) {
    const contacts = store.getContacts();
    let peter = contacts.find(c => c.name === "彼得·帕克");
    if (!peter) {
      peter = { name: "彼得·帕克", desc: "中城高中学生，善良但焦虑。", affinity: 0, heart: "暂无" };
      contacts.push(peter);
      store.setContacts(contacts);
    }
    store.setPeterBinding({ theaterId: q.id });
  },

  openQuest(id) {
    const list = JSON.parse(localStorage.getItem("sv_theaters") || "[]");
    const q = list.find(x => x.id === id);
    if (!q) return toast("小剧场不存在");

    currentApp = "theater";
    $("#desktop").classList.remove("active");
    $("#appView").classList.add("active");
    $("#appTitle").textContent = q.title;
    const sb = $("#appSettingsBtn");
    sb.style.display = "block";
    sb.textContent = "‹ 返回列表";
    sb.onclick = () => {
      currentApp = "Theater";
      $("#appTitle").textContent = "小剧场";
      sb.style.display = "none";
      sb.onclick = null;
      apps.Theater.render($("#appBody"));
    };
    this.renderQuest($("#appBody"), q);
  },

  renderQuest(body, q) {
    const isClosed = q.closed;
   let universeBadge = "";
    if (q.universe === "multiverse") {
      const uA = WORLD.parallelUniverses.find(u => u.key === q.universeA);
      const uB = WORLD.parallelUniverses.find(u => u.key === q.universeB);
      if (uA && uB) {
        universeBadge = `
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;">
            <div class="th-quest-universe" style="--u-color:${uA.color};">${esc(uA.title)} · ${esc(uA.year)}</div>
            <div style="font-size:14px;font-weight:700;color:var(--muted);padding:0 4px;">×</div>
            <div class="th-quest-universe" style="--u-color:${uB.color};">${esc(uB.title)} · ${esc(uB.year)}</div>
          </div>
        `;
      }
    } else {
      const universe = WORLD.parallelUniverses?.find(u => u.key === q.universe);
      universeBadge = universe
        ? `<div class="th-quest-universe" style="--u-color:${universe.color};">${esc(universe.title)} · ${esc(universe.year)}</div>`
        : "";
    }

    body.innerHTML = `
      <div class="th-wrap">
        <div class="th-quest-header">
          <div class="th-quest-title">${esc(q.title)}</div>
          ${universeBadge}
          <div class="th-quest-meta">
            <span>${esc(q.date)}</span>
            <span class="dot">·</span>
            <span>${q.pov === "first" ? "第一人称" : q.pov === "second" ? "第二人称" : "第三人称（" + esc(q.userName || "玩家") + "）"}</span>
            <span class="dot">·</span>
            <span>${esc(q.tone)}</span>
          </div>
          <div class="th-quest-bg">${esc((q.background || "").slice(0, 100))}...</div>
        </div>

        <div class="th-quest-actions" style="flex-wrap:wrap;">
          <button class="th-btn ghost small" id="gotoChatBtn">💬 去信息继续聊</button>
          <button class="th-btn ghost small" id="refreshQuestBtn">🔄 重置</button>
        </div>

        ${!isClosed ? `
        <div class="th-quest-actions" style="margin-top:8px;">
          <button class="th-btn ghost small" id="thSaveBtn">💾 存档</button>
          <button class="th-btn ghost small" id="thLoadBtn">📂 读档</button>
          <button class="th-btn ghost small" id="thMemoryBtn">📜 回忆</button>
        </div>
        ` : `
        <div class="th-quest-actions" style="margin-top:8px;">
          <button class="th-btn ghost small" id="thMemoryBtn">📜 回顾全部剧情</button>
        </div>
        `}

        <div class="th-quest-story">${formatDialogue(q.story)}</div>

        ${!isClosed ? `
          <div id="thOptions" class="th-options"></div>
          <div class="th-custom-action">
            <input id="thCustomAct" class="th-form-input" placeholder="自定义行动... 用（括号）可跳出剧情下达干预指令">
            <button class="th-btn primary" id="thSendBtn">发送</button>
          </div>
        ` : `
          <div class="th-quest-closed">
            <div class="th-quest-closed-text">这个小剧场已经完结。</div>
            <button class="th-btn primary" id="closedReviewBtn" style="margin-bottom:8px;">📖 回顾全部剧情</button>
            <button class="th-btn ghost" onclick="openApp('Theater')">返回列表</button>
          </div>
        `}
      </div>`;

    body.querySelector("#gotoChatBtn").onclick = () => {
      store.setPeterBinding({ theaterId: q.id });
      apps.messages.currentUser = "彼得·帕克";
      apps.messages.view = "chat";
      currentApp = "messages";

      $("#appView").classList.add("active");
      $("#desktop").classList.remove("active");
      $("#appTitle").textContent = "信息";

      const sb = $("#appSettingsBtn");
      sb.style.display = "flex";
      sb.innerHTML = `<span id="retryBtn" style="margin-right:15px;cursor:pointer">🔄</span><span id="setBtn" style="cursor:pointer">设置</span>`;
      sb.querySelector("#setBtn").onclick = () => apps.messages.renderSettings($("#appBody"));
      sb.querySelector("#retryBtn").onclick = () => {
        if (apps.messages.lastUserText) apps.messages.sendMessage($("#appBody"), apps.messages.lastUserText, true);
        else toast("请先发送消息后再重试");
      };

      apps.messages.render($("#appBody"));
    };

    body.querySelector("#refreshQuestBtn").onclick = () => {
      if (!confirm("重置会回到这个剧场的开场，确认？")) return;
      const list = JSON.parse(localStorage.getItem("sv_theaters") || "[]");
      const idx = list.findIndex(x => x.id === q.id);
      if (idx === -1) return;
      list[idx].story = list[idx].openingStory || list[idx].story;
      list[idx].options = list[idx].openingOptions || list[idx].options;
      list[idx].history = [];
      list[idx].closed = false;
      localStorage.setItem("sv_theaters", JSON.stringify(list));
      toast("已重置");
      this.openQuest(q.id);
    };

// ★ 存档 / 读档 / 回忆
    const saveBtn = body.querySelector("#thSaveBtn");
    const loadBtn = body.querySelector("#thLoadBtn");
    const memBtn = body.querySelector("#thMemoryBtn");

    if (saveBtn) saveBtn.onclick = () => this.openTheaterSlots(q.id, "save");
    if (loadBtn) loadBtn.onclick = () => this.openTheaterSlots(q.id, "load");
    if (memBtn) memBtn.onclick = () => this.showTheaterMemory(q);

    if (!isClosed) {
    const optsEl = body.querySelector("#thOptions");
    const opts = (q.options || "").split('\n').filter(l => /^[A-D][\.\、]/.test(l.trim()));
    optsEl.innerHTML = opts.map(o => `
      <button class="th-option-btn" onclick="window.advanceTheater('${q.id}', '${esc(o).replace(/'/g, "\\'")}')">${esc(o)}</button>
    `).join("");

    const input = body.querySelector("#thCustomAct");
    const send = () => {
      const v = input.value.trim();
      if (!v) return toast("请输入行动");
      window.advanceTheater(q.id, v);
    };
    body.querySelector("#thSendBtn").onclick = send;
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); send(); }
    });
  }

  // ★★★ 新增：完结剧场「回顾全部剧情」按钮的事件绑定 ★★★
 const closedReviewBtn = body.querySelector("#closedReviewBtn");
if (closedReviewBtn) {
  closedReviewBtn.onclick = () => apps.Theater.showTheaterMemory(q);
}
},

  // ============================================================
  // ★ 小剧场专用存档/读档（独立 key，不污染主线存档）
  // ============================================================
  openTheaterSlots(questId, mode) {
    const SLOT_KEY = "sv_theater_slots_" + questId;
    let slots = JSON.parse(localStorage.getItem(SLOT_KEY) || "null");
    if (!Array.isArray(slots) || slots.length !== 10) {
      slots = Array(10).fill(null);
      localStorage.setItem(SLOT_KEY, JSON.stringify(slots));
    }

    const div = document.createElement("div");
    div.style.cssText = "position:absolute;inset:0;background:#000e;z-index:700;padding:20px;overflow-y:auto;";
    div.innerHTML = `
      <h2 style="color:var(--text);margin-top:0;font-size:17px;">${mode === "save" ? "💾 小剧场存档（共10格）" : "📂 小剧场读档（共10格）"}</h2>
      <p style="font-size:12px;color:var(--muted);margin:0 0 12px;">此存档独立于主线，只影响当前小剧场。</p>
      <div id="thSlotList"></div>
      <button class="btn ghost" style="margin-top:12px" id="thSlotClose">关闭</button>`;
    document.querySelector(".device").appendChild(div);

    const listEl = div.querySelector("#thSlotList");
    slots.forEach((snap, i) => {
      const filled = !!snap;
      const label = filled
        ? `<b>第 ${snap.turn} 轮</b><br><span style="color:var(--muted);font-size:11px">${new Date(snap.timestamp).toLocaleString()}</span>`
        : "（空白档）";
      const row = document.createElement("div");
      row.style.cssText = "background:#14141c;border:1px solid #2a2a38;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;";
      row.innerHTML = `
        <div style="flex:1;color:${filled ? '#fff' : '#666'};font-size:13px;">
          <div style="font-size:11px;color:var(--muted);">档位 ${i + 1}</div>
          ${label}
        </div>
        <button class="btn" data-idx="${i}" style="width:auto;padding:8px 14px;${(!filled && mode === "load") ? "opacity:.4;pointer-events:none;" : ""}">
          ${filled ? (mode === "save" ? "覆盖" : "读取") : (mode === "save" ? "保存" : "不可用")}
        </button>`;
      listEl.appendChild(row);
    });

    div.querySelector("#thSlotClose").onclick = () => div.remove();

    listEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-idx]");
      if (!btn) return;
      const idx = parseInt(btn.dataset.idx);

      if (mode === "save") {
        if (slots[idx] && !confirm(`档位 ${idx + 1} 已有内容，是否覆盖？`)) return;
        const all = JSON.parse(localStorage.getItem("sv_theaters") || "[]");
        const q = all.find(x => x.id === questId);
        if (!q) return toast("剧场不存在");
        slots[idx] = {
          timestamp: Date.now(),
          turn: (q.history || []).length + 1,
          data: JSON.parse(JSON.stringify(q))
        };
        localStorage.setItem(SLOT_KEY, JSON.stringify(slots));
        toast("已保存到小剧场档位 " + (idx + 1));
        div.remove();
      } else {
        if (!slots[idx]) return toast("该档位为空");
        if (!confirm("读档会把小剧场回退到该存档时刻，确认继续？")) return;
        const all = JSON.parse(localStorage.getItem("sv_theaters") || "[]");
        const qIdx = all.findIndex(x => x.id === questId);
        if (qIdx === -1) return toast("剧场不存在");
        const backup = { id: all[qIdx].id, createdAt: all[qIdx].createdAt };
        all[qIdx] = { ...slots[idx].data, ...backup };
        localStorage.setItem("sv_theaters", JSON.stringify(all));
        toast("已读取小剧场档位 " + (idx + 1));
        div.remove();
        this.openQuest(questId);
      }
    });
  },

  // ============================================================
  // ★ 小剧场回忆（进行中 / 完结都能看）
  // ============================================================
  showTheaterMemory(q) {
    const history = q.history || [];
    const div = document.createElement("div");
    div.style.cssText = "position:absolute;inset:0;background:var(--bg);z-index:700;padding:20px;overflow-y:auto;color:var(--text);font-size:14px;line-height:1.7;border-left:1px solid var(--line);";

    if (!history.length && !q.story) {
      div.innerHTML = `
        <h2 style="color:var(--text);">📜 回忆</h2>
        <p style="color:var(--muted);">这个小剧场还没有任何剧情记录。</p >
        <button class="btn" style="margin-top:20px" id="memClose">关闭</button>`;
      document.querySelector(".device").appendChild(div);
      div.querySelector("#memClose").onclick = () => div.remove();
      return;
    }

   let blocksHtml = "";
    history.forEach((h, i) => {
      blocksHtml += `
        <div style="background:var(--panel);padding:14px;border-radius:12px;margin-bottom:12px;border-left:3px solid var(--accent-2);border-right:1px solid var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
          <div style="color:var(--muted);font-size:11px;margin-bottom:8px;letter-spacing:0.5px;">— 第 ${i + 1} 轮 —</div>
          <div style="white-space:pre-wrap;color:var(--text);font-size:13px;line-height:1.75;max-height:220px;overflow-y:auto;">${formatDialogue(h.story)}</div>
          <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--accent-2);font-size:12px;">
            ➤ 你的选择：<span style="color:var(--text);">${esc(h.choice || "")}</span>
          </div>
        </div>`;
    });

    if (q.story) {
      const isFinal = q.closed;
      blocksHtml += `
        <div style="background:var(--panel);padding:14px;border-radius:12px;margin-bottom:12px;border-left:3px solid ${isFinal ? '#4caf50' : 'var(--accent-2)'};border-right:1px solid var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
          <div style="color:${isFinal ? '#4caf50' : 'var(--muted)'};font-size:11px;margin-bottom:8px;letter-spacing:0.5px;">
            ${isFinal ? "🏁 结局" : `— 第 ${history.length + 1} 轮（当前）—`}
          </div>
          <div style="white-space:pre-wrap;color:var(--text);font-size:13px;line-height:1.75;">${formatDialogue(q.story)}</div>
        </div>`;
    }

    const totalTurns = history.length + (q.story ? 1 : 0);
    div.innerHTML = `
      <h2 style="color:var(--text);position:sticky;top:0;background:var(--bg);padding-bottom:12px;margin-top:0;font-size:17px;z-index:2;">
        📜 ${esc(q.title)} · 共 ${totalTurns} 段
      </h2>
      ${blocksHtml}
      <button class="btn" style="margin-top:10px" id="memClose">关闭</button>`;
    document.querySelector(".device").appendChild(div);
    div.querySelector("#memClose").onclick = () => div.remove();
  },

 // ============================================================
  // ★ 完结剧场「回顾」页（只读）
  // ============================================================
  openReview(id) {
    const list = JSON.parse(localStorage.getItem("sv_theaters") || "[]");
    const q = list.find(x => x.id === id);
    if (!q) return toast("剧场不存在");

    currentApp = "theater";
    $("#desktop").classList.remove("active");
    $("#appView").classList.add("active");
    $("#appTitle").textContent = "📖 回顾 · " + q.title;

    const sb = $("#appSettingsBtn");
    sb.style.display = "block";
    sb.textContent = "‹ 返回列表";
    sb.onclick = () => {
      currentApp = "Theater";
      $("#appTitle").textContent = "小剧场";
      sb.style.display = "none";
      sb.onclick = null;
      apps.Theater.render($("#appBody"));
    };

    const body = $("#appBody");
    const universe = WORLD.parallelUniverses?.find(u => u.key === q.universe);
    const universeBadge = universe
      ? `<div class="th-quest-universe" style="--u-color:${universe.color};">${esc(universe.title)} · ${esc(universe.year)}</div>`
      : "";

    body.innerHTML = `
      <div class="th-wrap">
        <div class="th-quest-header">
          <div class="th-quest-title">
            ${esc(q.title)}
            <span style="display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:#4caf50;background:rgba(76,175,80,.15);padding:2px 10px;border-radius:8px;vertical-align:middle;">✅ 已完结</span>
          </div>
          ${universeBadge}
          <div class="th-quest-meta">
            <span>${esc(q.date)}</span>
            <span class="dot">·</span>
            <span>共 ${(q.history || []).length + (q.story ? 1 : 0)} 段</span>
          </div>
          <div class="th-quest-bg">${esc((q.background || "").slice(0, 100))}...</div>
        </div>

        <div class="th-quest-actions">
          <button class="th-btn ghost small" id="reviewMemBtn">📜 全部剧情</button>
          <button class="th-btn ghost small" id="reviewReopenBtn">🔄 重新开始</button>
        </div>

        <div id="reviewContent"></div>
      </div>`;

    const renderReview = () => {
      const c = body.querySelector("#reviewContent");
      const history = q.history || [];
      let html = "";
      history.forEach((h, i) => {
        html += `
          <div style="background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:12px;margin-bottom:12px;border-left:3px solid var(--accent-2);">
            <div style="color:var(--muted);font-size:11px;margin-bottom:8px;">— 第 ${i + 1} 轮 —</div>
            <div style="white-space:pre-wrap;color:var(--text);font-size:13px;line-height:1.75;">${formatDialogue(h.story)}</div>
            <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--accent-2);font-size:12px;">
              ➤ 你的选择：<span style="color:var(--text);">${esc(h.choice || "")}</span>
            </div>
          </div>`;
      });
      if (q.story) {
        html += `
          <div style="background:var(--panel);border:1px solid #4caf50;padding:14px;border-radius:12px;margin-bottom:12px;border-left:3px solid #4caf50;">
            <div style="color:#4caf50;font-size:11px;margin-bottom:8px;">🏁 结局</div>
            <div style="white-space:pre-wrap;color:var(--text);font-size:13px;line-height:1.75;">${formatDialogue(q.story)}</div>
          </div>`;
      }
      if (!html) html = `<div class="th-empty">没有剧情记录</div>`;
      c.innerHTML = html;
    };
    renderReview();

    body.querySelector("#reviewMemBtn").onclick = () => this.showTheaterMemory(q);

    body.querySelector("#reviewReopenBtn").onclick = () => {
      if (!confirm("重新开始会把剧场回到开场，且重置本轮进度（历史清空），确认？")) return;
      const all = JSON.parse(localStorage.getItem("sv_theaters") || "[]");
      const idx = all.findIndex(x => x.id === q.id);
      if (idx === -1) return;
      all[idx].story = all[idx].openingStory || all[idx].story;
      all[idx].options = all[idx].openingOptions || all[idx].options;
      all[idx].history = [];
      all[idx].closed = false;
      localStorage.setItem("sv_theaters", JSON.stringify(all));
      toast("已重置剧场");
      this.openQuest(q.id);
    };
  },
},

 showDiary(d, who) {

直接输出回应内容，不要任何前缀。`;

music: {
  title: "音乐",
  async render(body) {
    body.innerHTML = `<div style="padding:14px">
      <div class="card"><h3>🎵 后台播放器（切换 App 不中断）</h3>
        <audio id="musicInlineAudio" controls style="width:100%"></audio>
        <div id="nowPlaying" style="font-size:12px;color:var(--muted);margin-top:8px">未播放</div>
      </div>
      <div class="card"><h3>本地音乐 (支持 MP3/FLAC)</h3>
        <input type="file" id="audioFile" accept="audio/*,.mp3,.m4a,.wav,.ogg,.mp4,.flac" multiple style="width:100%;color:var(--text);margin-bottom:10px">
        <p style="color:var(--muted);font-size:12px;margin:0">提示：识别歌手与歌名（如：歌手 - 歌名.mp3）。</p>
      </div>
      <div class="card"><h3>🎧 播放列表</h3><div id="trackList" style="color:var(--muted);font-size:13px">加载中...</div></div>
    </div>`;

    const input = body.querySelector("#audioFile");
    const trackList = body.querySelector("#trackList");
    const inlineAudio = body.querySelector("#musicInlineAudio");
    const nowPlaying = body.querySelector("#nowPlaying");

    let tracks = await globalMusic.loadTracks();

    // 同步全局 <audio> → App 内 <audio>
  const mirrorGlobal = () => {
      if (!globalMusic.audio || !globalMusic.audio.src) return;
      const gSrc = globalMusic.audio.src.split('#')[0].split('?')[0];
      const iSrc = inlineAudio.src.split('#')[0].split('?')[0];
      
      // 只有当 src 确实不同的时候，才去替换
      if (gSrc !== iSrc) {
        inlineAudio.src = globalMusic.audio.src;
        inlineAudio.load(); // 强制重新加载新源
      }
      
      // 如果全局在播放，但 App 内没播放，才去触发 play
      if (!globalMusic.audio.paused) {
        if (inlineAudio.paused) {
          inlineAudio.currentTime = globalMusic.audio.currentTime;
          inlineAudio.play().catch(()=>{});
        }
      } else {
        if (!inlineAudio.paused) inlineAudio.pause();
      }
    };

    const renderList = () => {
      if (!tracks.length) { trackList.textContent = "暂无"; return; }
      trackList.innerHTML = tracks.map((t) => {
        const isPlaying = globalMusic.currentId === t.id && !globalMusic.audio.paused;
        return `<div style="padding:10px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center">
          <span style="cursor:pointer;flex:1" data-play="${t.id}">${isPlaying ? "⏸" : "▶"} ${esc(t.name)}</span>
          <button class="btn ghost" data-del="${t.id}" style="width:auto;padding:2px 8px;font-size:12px;color:#e62429;border:none">✕</button>
        </div>`;
      }).join("");

      trackList.querySelectorAll("[data-play]").forEach(el => {
        el.onclick = () => {
          globalMusic.toggle(el.dataset.play);
          renderList();
          refreshUI();
        };
      });
      trackList.querySelectorAll("[data-del]").forEach(el => {
        el.onclick = async (e) => {
          e.stopPropagation();
          if (globalMusic.currentId === el.dataset.del) globalMusic.stop();
          await dbHelper.delete(el.dataset.del);
          tracks = await globalMusic.loadTracks();
          renderList();
          refreshUI();
          toast("已删除");
        };
      });
    };

    const refreshUI = () => {
      const cur = globalMusic.tracks.find(x => x.id === globalMusic.currentId);
      nowPlaying.textContent = cur
        ? `${globalMusic.audio.paused ? "⏸ 已暂停" : "▶ 正在播放"}：${cur.name}`
        : "未播放";
      mirrorGlobal();
    };

    window._musicRefreshUI = () => {
      renderList();
      refreshUI();
    };

    // 双向同步：App 内 <audio> → 全局 <audio>
    inlineAudio.onplay = () => {
      if (globalMusic.audio.paused && globalMusic.currentId) {
        globalMusic.audio.currentTime = inlineAudio.currentTime;
        globalMusic.audio.play().catch(()=>{});
      }
    };
    inlineAudio.onpause = () => {
      if (!globalMusic.audio.paused) globalMusic.audio.pause();
    };
    inlineAudio.onseeked = () => {
      globalMusic.audio.currentTime = inlineAudio.currentTime;
    };

    renderList();
    refreshUI();

   input.onchange = async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      let added = 0, skipped = 0, converted = 0;

      for (let idx = 0; idx < files.length; idx++) {
        const file = files[idx];

        // 显示整体进度
        toast(`处理第 ${idx + 1}/${files.length} 首：${file.name}`);
        // 让 UI 有机会更新 toast
        await new Promise(r => setTimeout(r, 50));

        // 1. 先做文件名清洗
        let displayName = file.name.replace(/\.[^/.]+$/, "");
        displayName = displayName.replace(/\.(mgg|mgg2|qmc\d?|tm\d?)$/i, "");
        displayName = displayName.replace(/\[[\s\S]*?\]|\([\s\S]*?\)/g, "").trim();
        let parts = displayName.split("-");
        if (parts.length >= 2) {
          displayName = `${parts[0].trim()} - ${parts.slice(1).join("-").trim()}`;
        }

        // 2. 判断是否需要转换
        let finalBuffer = null;
        let finalMime = "";
        let didConvert = false;

        if (audioConverter.needConvert(file)) {
          try {
            const res = await audioConverter.convert(file, (stage) => {
              // 进度提示（覆盖上一层 toast）
              // 用 toast 会排队，这里用 console 避免打扰
              console.log(`[${file.name}] ${stage}`);
            });
            finalBuffer = await res.blob.arrayBuffer();
            finalMime = res.mime;
            didConvert = true;
            converted++;
          } catch (err) {
            // 转码失败（如 iOS Safari 不支持 FLAC 解码）→ 明确告知用户，跳过
            toast("跳过《" + file.name + "》：" + err.message);
            skipped++;
            continue;
          }
        } else {
          // 3. 不需要转换，直接存
          const buffer = await file.arrayBuffer();
          if (!buffer || buffer.byteLength === 0) {
            toast("跳过空文件：" + file.name);
            skipped++;
            continue;
          }
          finalBuffer = buffer;
          let mime = file.type || "";
          const ext = (file.name.split(".").pop() || "").toLowerCase();
          if (!mime) {
            if (ext === "mp3") mime = "audio/mpeg";
            else if (ext === "m4a") mime = "audio/mp4";
            else if (ext === "wav") mime = "audio/wav";
            else if (ext === "ogg") mime = "audio/ogg";
            else mime = "";
          }
          finalMime = mime;
        }

        // 4. 保存到 IndexedDB
        await dbHelper.save({
          id: Date.now().toString() + Math.random().toString(36).slice(2, 11),
          name: displayName,
          type: finalMime,
          data: finalBuffer,
          converted: didConvert // 记录一下是否为转码产物（可选）
        });
        added++;
      }

      // 5. 刷新列表
      tracks = await globalMusic.loadTracks();
      renderList();

      const summary = [`成功 ${added} 首`];
      if (converted) summary.push(`已转码 ${converted} 首`);
      if (skipped) summary.push(`跳过 ${skipped} 首`);
      toast(summary.join(" / "));
      input.value = "";
      };
    }
  }
};

// ===== 10 格存档系统 =====
const SLOT_COUNT=10;
function getSlots(){
  let slots=JSON.parse(localStorage.getItem("sv_slots")||"null");
  if(!Array.isArray(slots)||slots.length!==SLOT_COUNT){slots=Array(SLOT_COUNT).fill(null);localStorage.setItem("sv_slots",JSON.stringify(slots));}
  return slots;
}
function setSlots(slots){localStorage.setItem("sv_slots",JSON.stringify(slots));}

window.openSlots=(mode)=>{
  const slots=getSlots();
  const div = document.createElement("div");
    div.style.cssText = "position:absolute;inset:0;background:var(--bg);z-index:700;padding:20px;overflow-y:auto;";
  div.innerHTML=`<h2 style="color:var(--text);margin-top:0">${mode==="save"?"💾 存档（共10格）":"📂 读档（共10格）"}</h2><div id="slotList"></div><button class="btn ghost" style="margin-top:12px" onclick="this.parentNode.remove()">关闭</button>`;
  const list=div.querySelector("#slotList");
  slots.forEach((snap,i)=>{
    const filled=!!snap;
    const label=filled?`${snap.label}<br><span style="color:var(--muted) ;font-size:11px">${new Date(snap.timestamp).toLocaleString()}</span>`:"（空白档）";
    const row = document.createElement("div");
      row.style.cssText = "background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;";
     row.innerHTML = `<div style="flex:1;color:${filled ? 'var(--text)' : 'var(--muted)'};font-size:13px;"><div style="font-size:11px;color:var(--muted);">档位 ${i + 1}</div>${label}</div>
          <button class="btn" data-idx="${i}" style="width:auto;padding:8px 14px;">${filled ? "覆盖" : "保存"}</button>`;
    list.appendChild(row);
  });
  list.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-idx]"); if (!btn) return;
  const idx = parseInt(btn.dataset.idx);

  if (mode === "save") {
    // ★ 关键：每次都重新读一次，防止打开面板后数据被别处改过
    const freshSlots = getSlots();
    if (freshSlots[idx]) {
      if (!confirm(`存档位 ${idx + 1} 已有内容，是否覆盖？`)) return;
    }
    try {
      storeSlot(idx);
      // ★ 保存成功后立刻刷新列表 UI，让用户看到"已保存"
      const newSlots = getSlots();
      list.querySelectorAll("button[data-idx]").forEach(b => {
        const i = parseInt(b.dataset.idx);
        const row = b.closest("div[style*='border-radius']");
        if (!row) return;
        const labelDiv = row.querySelector("div > div");
        const filled = !!newSlots[i];
        b.textContent = filled ? "覆盖" : "保存";
        b.style.color = filled ? "var(--text)" : "var(--muted)";
        if (labelDiv) {
          labelDiv.innerHTML = filled
            ? `<div style="font-size:11px;color:var(--muted);">档位 ${i + 1}</div>${newSlots[i].label}<br><span style="color:var(--muted);font-size:11px">${new Date(newSlots[i].timestamp).toLocaleString()}</span>`
            : `<div style="font-size:11px;color:var(--muted);">档位 ${i + 1}</div>（空白档）`;
        }
      });
      toast(`✅ 已存档到位置 ${idx + 1}`);
    } catch (err) {
      console.error("[存档失败]", err);
      toast("❌ 存档失败：" + (err.message || "未知错误"));
    }
  } else {
    if (!slots[idx]) return toast("该存档位为空");
    loadSlot(idx);
    div.remove();
  }
});
  document.querySelector(".device").appendChild(div);
};

showMsgBanner(data.sender, data.messages[0] || "");

  clearTimeout(window._bannerTimer);
  // 保存当前聊天对象（如果有）
  const previousUser = apps.messages.currentUser;
  const previousView = apps.messages.view;
  // 切换到这个 NPC
  apps.messages.currentUser = sender;
  apps.messages.view = "chat";
  openApp("messages");
  // 如果用户想返回，可以点「返回」回到列表（不影响之前彼得那边）
  // 不再额外覆盖 previousUser
 };
};
// ============================================================
// ★ 彼得主动发信检查
// ============================================================
window.peterProactiveCheck = async function() {
  const cfg = store.getProactiveCfg();
  if (!cfg.enabled) return;

  const lastAct = parseInt(localStorage.getItem("sv_peter_last_user_act") || "0") || 0;
  const idleTurns = parseInt(localStorage.getItem("sv_peter_idle_turns") || "0") || 0;
  const now = Date.now();
  const idleMinutes = lastAct ? Math.floor((now - lastAct) / 60000) : 0;

  // 判定是否满足触发条件（两个条件任一即可）
  const triggerByTurns = idleTurns >= (cfg.idleCount || 5);
  const triggerByMinutes = lastAct && idleMinutes >= (cfg.idleMinutes || 30);
  if (!triggerByTurns && !triggerByMinutes) return;

  // 防止短时间内重复触发：5 分钟内只主动发一次
  const lastProactive = parseInt(localStorage.getItem("sv_peter_last_proactive") || "0") || 0;
  if (now - lastProactive < 5 * 60 * 1000) return;

  // 检查彼得是否已经是联系人
  const contacts = store.getContacts();
  const peter = contacts.find(c => c.name === "彼得·帕克");
  if (!peter) return;

  // 检查好感度
  const aff = getAffinityOf("彼得·帕克");
  if (aff < 21) return; // 陌生人/点头之交不会主动发

  // 打标记，防止并发
  localStorage.setItem("sv_peter_last_proactive", String(now));
  localStorage.setItem("sv_peter_idle_turns", "0");

  try {
    const s = store.getState();
    const phase = WORLD.timeline[s.anchor] || WORLD.timeline[0];
    const date = `${s.gameYear}年${s.gameMonth}月${s.gameDay}日`;
    const isEn = store.getChatConfig().lang === "en";
    const playerName = store.getProfile().name || "玩家";
    const playerGender = store.getProfile().gender === "male" ? "男" : "女";
    const playerPronoun = playerGender === "男" ? "他" : "她";

    // 取最近几条聊天上下文
    const chats = store.getChats();
    const arr = chats["彼得·帕克"] || [];
    const recent = arr.slice(-6).map(m => ({
      role: m.role === "me" ? "user" : "assistant",
      content: (m.content || "").replace(/HEART\s*[:：][\s\S]*/i, "").trim()
    })).filter(m => m.content);

    const affBehavior = buildAffinityBehaviorBlock("彼得·帕克", aff);
    const idleReason = triggerByMinutes
      ? `${playerName}已经 ${idleMinutes} 分钟没回你的消息了`
      : `你已经连续 ${idleTurns} 回合没跟${playerName}联系了`;

    const sysPrompt = `你是漫威的「彼得·帕克」，正在用手机给「${playerName}」（${playerGender}，用「${playerPronoun}」指代）发短信。
你和${playerName}的关系见下方好感度设定。

【当前日期】${date}
【当前阶段】${phase.name}
【好感度】${aff}/200
${affBehavior}

【情境】
${idleReason}。你此刻突然想起了${playerName}，于是主动发来一条消息。

【发送规则 · 违反即失败】
1. 这是**手机短信**。严禁动作描写、括号、星号。
2. 生成 1 到 3 条消息。
3. 用 || 分隔每条消息。
4. 内容要符合好感度和彼得的话痨+跑题+突然认真的风格。
5. **不要**一上来就问"你怎么不回我" —— 太直白。要通过别的话题切入（比如突然分享今天遇到的事、突然想起什么、突然想问 ta 个问题）。
6. 如果好感度 ≥101，可以略带想念、关心。
7. ${isEn ? "全部用英文。" : "全部用纯中文，可夹少量英文口语。"}

【输出格式】
只输出消息本身，多条用 || 分隔。不要任何前缀、编号、解释。`;

    const res = await callAI(
      recent.length ? recent : [{ role: "user", content: "……" }],
      sysPrompt
    );

    const msgs = res.split("||").map(x => x.trim()).filter(Boolean);
    if (!msgs.length) return;

    // 存入聊天记录
    const chatsNow = store.getChats();
    const arrNow = chatsNow["彼得·帕克"] || [];
    msgs.forEach(m => arrNow.push({ role: "them", content: m }));
    chatsNow["彼得·帕克"] = arrNow;
    store.setChats(chatsNow);

    // 弹出横幅
    if (typeof showMsgBanner === "function") {
      showMsgBanner("彼得·帕克", msgs[0] || "");
    } else {
      toast("💬 彼得：" + (msgs[0] || ""));
    }

    // 如果当前正在和彼得聊天，刷新界面
    if (apps.messages.currentUser === "彼得·帕克" && apps.messages.view === "chat") {
      apps.messages.render(document.getElementById("appBody"));
    }
  } catch (e) {
    console.warn("彼得主动发信失败:", e);
    // 失败时把标记还原，方便下次重试
    localStorage.setItem("sv_peter_last_proactive", "0");
  }
};

// ★ 定时检查（每 60 秒一次）
if (!window._peterProactiveTimer) {
  window._peterProactiveTimer = setInterval(() => {
    try { window.peterProactiveCheck(); } catch (e) { console.warn(e); }
  }, 60 * 1000);
}
// 自动识别剧情中的英语或中文对话，并应用仿宋斜体
function formatDialogue(text) {
  if (!text) return "";
  let s = esc(text);

  // ✂️ 第一步：把各种"对话包裹格式"统一识别并包 span
  // 顺序很重要：先匹配最长的、最具体的，避免被短的正则抢先吃掉
  const patterns = [
    // 1) *"..."*  —— 星号 + 半角引号（最标准）
    /\*"[^"\n]*"\*/g,
    // 2) *“...”*  —— 星号 + 中文弯引号
    /\*“[^”\n]*”\*/g,
    // 3) "..."  —— 纯半角引号（无星号）
    /"[^"\n]*"/g,
    // 4) “...”  —— 纯中文弯引号
    /“[^”\n]*”/g,
    // 5) *...*  —— 纯星号包裹（无引号），放最后，避免吃掉 markdown 加粗
    /\*[^*\n]{2,}\*/g,
  ];

  // 用一个 Set 记录已被包裹的位置，避免重复包裹
  const spans = [];

  // 收集所有匹配
  patterns.forEach((re) => {
    let m;
    while ((m = re.exec(s)) !== null) {
      spans.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
    }
  });

  // 按起点排序，去重（重叠的保留最长的那段）
  spans.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));

  const merged = [];
  for (const sp of spans) {
    const last = merged[merged.length - 1];
    if (last && sp.start < last.end) {
      // 有重叠：如果新的更长，替换
      if (sp.end - sp.start > last.end - last.start) {
        merged[merged.length - 1] = sp;
      }
    } else {
      merged.push(sp);
    }
  }

  // 从后往前替换，避免索引错位
  for (let i = merged.length - 1; i >= 0; i--) {
    const sp = merged[i];
    const wrapped = `<span class="dialogue-text">${sp.text}</span>`;
    s = s.slice(0, sp.start) + wrapped + s.slice(sp.end);
  }

  return s;
}
